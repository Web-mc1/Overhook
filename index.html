<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Overhook - Nightmare Sky Edition</title>
<style>
  :root{
    --sky-top:#05000a;
    --sky-mid:#1a001a;
    --sky-low:#3d000a;
    --cloud:#2a0515;
    --cloud-border:#ff003c;
    --rope:#ff003c;
    --ember:#ff003c;
    --ember-core:#ffffff;
    --ink:#ffffff;
    --ink-dim:#aa8899;
    --danger:#ff003c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--sky-top);
    overflow:hidden;
    font-family: 'Courier New', Courier, monospace, sans-serif;
    user-select:none;
    touch-action:none;
  }
  canvas{
    display:block;
    width:100%; height:100%;
    cursor:crosshair;
  }
  .overlay{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:var(--ink);
    background:radial-gradient(ellipse at 50% 30%, rgba(61,0,10,0.7), rgba(5,0,10,0.95) 70%);
    pointer-events:none;
    animation:fadein .35s ease;
  }
  .overlay.hidden{display:none;}
  .overlay > *{pointer-events:auto;}
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}

  .title{
    font-size:clamp(46px,10vw,84px);
    font-weight:900;
    letter-spacing:4px;
    margin:0;
    color: #ff003c;
    text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 0 0 20px #ff003c;
    animation: titleGlitch 2s ease-in-out infinite alternate;
  }
  @keyframes titleGlitch {
    0% { transform: rotate(-1deg) translateY(0px); }
    90% { transform: rotate(-1deg) translateY(-2px); }
    95% { transform: rotate(1deg) translateY(2px) skewX(5deg); text-shadow: -4px -4px 0 #00ffff; }
    100% { transform: rotate(-1deg) translateY(-4px); text-shadow: 4px 4px 0 #000, 0 0 25px #ff003c; }
  }

  .author{
    margin: 6px 0 0;
    color: var(--rope);
    font-size: clamp(14px, 2.8vw, 18px);
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(255, 0, 60, 0.7);
  }

  .tagline{
    margin:8px 0 24px;
    color:var(--ink-dim);
    font-size:clamp(13px,2.4vw,16px);
    letter-spacing:1px;
    max-width:440px;
    line-height:1.5;
    text-shadow: 1px 1px 0 #000;
  }
  .rules{
    list-style:none; padding:0; margin:0 0 30px;
    color:var(--ink-dim);
    font-size:14px;
    display:flex; flex-direction:column; gap:8px;
  }
  .rules li{display:flex; align-items:center; gap:10px; justify-content:center;}
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--rope);
    box-shadow:0 0 8px var(--rope);
    flex:none;
  }
  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:inherit; font-weight:900; letter-spacing:2px;
    font-size:18px; color:#ffffff;
    padding:14px 38px; border-radius:6px;
    background:#ff003c;
    border: 2px solid #000;
    box-shadow:0 0 15px rgba(255,0,60,0.6);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn:hover{transform:scale(1.05); background:#ff2255; box-shadow:0 0 25px rgba(255,0,60,0.9);}
  .btn:active{transform:scale(0.98);}

  #hud{
    position:fixed; top:18px; left:0; right:0;
    display:flex; justify-content:center;
    pointer-events:none;
    color:var(--ink);
    font-weight:900; font-size:15px; letter-spacing:1px;
  }
  #hud .pill{
    background:rgba(5,0,10,0.85);
    border:1px solid #550011;
    box-shadow: 0 4px 10px #000;
    padding:8px 18px; border-radius:6px;
    display:flex; gap:18px;
  }
  #hud span.label{color:var(--ink-dim); font-weight:700; margin-right:4px;}
  #hud .best{color:var(--rope);}

  .go-title{
    font-size:clamp(30px,7vw,46px);
    font-weight:900; margin:0 0 6px;
    color:var(--danger);
    text-shadow:0 0 18px rgba(255,0,60,0.8);
    letter-spacing: 2px;
  }
  .stat{
    font-size:15px; color:var(--ink-dim); margin:4px 0;
  }
  .stat b{color:var(--ink); font-size:22px;}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" style="display:none;">
  <div class="pill">
    <div><span class="label">DEPTH</span><span id="scoreVal" style="color:#ff003c;">0</span>m</div>
    <div class="best"><span class="label" style="color:inherit;">MAX DEPTH</span><span id="bestVal">0</span>m</div>
  </div>
</div>

<div id="startScreen" class="overlay">
  <h1 class="title">OVERHOOK</h1>
  <div class="author">Made by FryedCheese</div>
  <p class="tagline">NIGHTMARE SKY EDITION</p>
  <ul class="rules">
    <li><span class="dot"></span> Click rapidly to surge forward with speed boosts</li>
    <li><span class="dot"></span> Hold near an eye entity to extend your tendril</li>
    <li><span class="dot"></span> Escape the crimson void before it claims you</li>
  </ul>
  <button class="btn" id="playBtn">ENTER THE VOID</button>
</div>

<div id="gameOverScreen" class="overlay hidden">
  <h2 class="go-title">CONSUMED BY THE ABYSS</h2>
  <p class="stat">Depth Reached<br><b id="finalScore">0</b> m</p>
  <p class="stat">Max Depth<br><b id="finalBest">0</b> m</p>
  <button class="btn" id="retryBtn" style="margin-top:18px;">TRY AGAIN</button>
</div>

<script>
(function(){
  // Audio Synthesizer
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playHookSound() {
    if (audioCtx.state !== 'running') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  }

  function playBoostSound() {
    if (audioCtx.state !== 'running') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.08);
  }

  function playDeathSound() {
    if (audioCtx.state !== 'running') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.6);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.6);
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const hud = document.getElementById('hud');
  const scoreVal = document.getElementById('scoreVal');
  const bestVal = document.getElementById('bestVal');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');

  let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildStars();
  }
  window.addEventListener('resize', resize);

  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

  // ---------- constants ----------
  const GRAVITY = 0.62;
  const DRAG = 0.9975;
  const MAX_GRAPPLE_RANGE = 340;
  const CLOUD_MIN_R = 20;

  // ---------- state ----------
  let state = 'start';
  let best = 0;
  let stars = [];

  let player = null;
  let camera = {x:0, y:0};
  let clouds = [];
  let particles = [];
  let grapple = {active:false, cloud:null, length:0};
  let pointer = {x:0, y:0, down:false};
  let keys = {space:false};
  let furthestSpawnX = 0;
  let centerY = 0;
  let score = 0;
  let shake = 0;
  let lastClickTime = 0;

  function buildStars(){
    stars = [];
    const count = Math.floor((W*H)/8000);
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*W*3 - W,
        y: Math.random()*H,
        r: Math.random()*2+0.5,
        tw: Math.random()*Math.PI*2,
        layer: Math.random()<0.5?0.15:0.35
      });
    }
  }

  function initGame(){
    player = {x:120, y:H*0.4, vx:2.2, vy:0, r:14, pulseScale: 1};
    camera = {x:0, y:player.y - H*0.45};
    clouds = [];
    particles = [];
    grapple = {active:false, cloud:null, length:0};
    pointer = {x:W*0.6, y:H*0.4, down:false};
    keys = {space:false};
    score = 0;
    shake = 0;
    lastClickTime = 0;
    centerY = player.y + 30;
    furthestSpawnX = 0;

    addCloud(300, player.y+70, 34, false);
    furthestSpawnX = 300;
    while(furthestSpawnX < W*2) spawnNextCloud();
  }

  function addCloud(x,y,r,moving){
    const axis = Math.random()<0.5?'x':'y';
    clouds.push({
      x,y,r,moving,
      baseX:x, baseY:y,
      phase:Math.random()*Math.PI*2,
      amp: 36+Math.random()*70,
      speed: 0.35+Math.random()*0.55,
      axis,
      pulse: Math.random() * Math.PI * 2
    });
  }

  function spawnNextCloud(){
    const distFactor = clamp(furthestSpawnX/6500, 0, 1);
    const gap = 125 + distFactor*95 + Math.random()*(95+distFactor*150);
    const vertVar = 60 + distFactor*150;
    const drift = 40 + distFactor*70;

    centerY += (Math.random()-0.5)*drift;
    centerY = clamp(centerY, player.y-520, player.y+520);

    let y = centerY + (Math.random()-0.5)*2*vertVar;
    y = clamp(y, 90, H*2.4);

    const r = clamp(38 - distFactor*10 - Math.random()*8, CLOUD_MIN_R, 42);
    const movingChance = 0.12 + distFactor*0.36;
    const moving = Math.random() < movingChance;

    furthestSpawnX += gap;
    addCloud(furthestSpawnX, y, r, moving);
  }

  function worldToScreen(x,y){ return {x: x-camera.x, y: y-camera.y}; }
  function screenToWorld(x,y){ return {x: x+camera.x, y: y+camera.y}; }

  function findGrappleTarget(){
    const w = screenToWorld(pointer.x, pointer.y);
    let best=null, bestD=Infinity;
    for(const c of clouds){
      const dPlayer = Math.hypot(c.x-player.x, c.y-player.y);
      if(dPlayer > MAX_GRAPPLE_RANGE) continue;
      const dPointer = Math.hypot(c.x-w.x, c.y-w.y);
      if(dPointer < bestD){ bestD=dPointer; best=c; }
    }
    return best;
  }

  function findNearestAheadCloud(){
    let best=null, bestD=Infinity;
    for(const c of clouds){
      if(c.x < player.x-10) continue;
      const d = Math.hypot(c.x-player.x, c.y-player.y);
      if(d>MAX_GRAPPLE_RANGE) continue;
      if(d<bestD){bestD=d;best=c;}
    }
    return best;
  }

  function fireGrapple(cloud){
    if(!cloud) return;
    grapple.active = true;
    grapple.cloud = cloud;
    grapple.length = Math.hypot(player.x-cloud.x, player.y-cloud.y);
    playHookSound();
  }
  function releaseGrapple(){
    grapple.active=false; grapple.cloud=null;
  }

  // ---------- input ----------
  function triggerSpeedBoost() {
    const now = performance.now();
    const dt = now - lastClickTime;
    lastClickTime = now;

    if (dt < 350) {
      const intensity = clamp(350 / Math.max(dt, 80), 1, 3);
      player.vx += 1.8 * intensity;
      player.vy -= 0.6 * intensity;
      player.pulseScale = 1.4;
      playBoostSound();
    }
  }

  function onDown(x,y){
    if (audioCtx.state === 'suspended') audioCtx.resume();
    pointer.x=x; pointer.y=y; pointer.down=true;
    if(state==='playing'){
      triggerSpeedBoost();
      const target = findGrappleTarget();
      if(target) fireGrapple(target);
    }
  }
  function onMove(x,y){ pointer.x=x; pointer.y=y; }
  function onUp(){ pointer.down=false; releaseGrapple(); }

  canvas.addEventListener('pointerdown', e=>{ onDown(e.clientX,e.clientY); });
  canvas.addEventListener('pointermove', e=>{ onMove(e.clientX,e.clientY); });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  window.addEventListener('keydown', e=>{
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if(e.code==='Space'){
      e.preventDefault();
      if(!keys.space){
        keys.space=true;
        if(state==='playing'){
          triggerSpeedBoost();
          const target = findNearestAheadCloud();
          if(target) fireGrapple(target);
        }
      }
    }
  });
  window.addEventListener('keyup', e=>{
    if(e.code==='Space'){ keys.space=false; if(!pointer.down) releaseGrapple(); }
  });

  // ---------- update ----------
  function update(dt){
    const nDt = clamp(dt*60, 0.001, 2.2);

    for(const c of clouds){
      c.pulse += 0.05 * nDt;
      if(c.moving){
        c.phase += c.speed*0.016*nDt;
        if(c.axis==='x') c.x = c.baseX + Math.sin(c.phase)*c.amp;
        else c.y = c.baseY + Math.sin(c.phase)*c.amp;
      }
    }

    player.vy += GRAVITY*nDt;
    const df = Math.pow(DRAG, nDt);
    player.vx *= df; player.vy *= df;
    player.x += player.vx*nDt;
    player.y += player.vy*nDt;

    if(player.pulseScale > 1) {
      player.pulseScale -= 0.05 * nDt;
    }

    if(grapple.active && grapple.cloud){
      const c = grapple.cloud;
      let dx = player.x-c.x, dy = player.y-c.y;
      let dist = Math.hypot(dx,dy) || 0.0001;
      const nx=dx/dist, ny=dy/dist;
      player.x = c.x + nx*grapple.length;
      player.y = c.y + ny*grapple.length;
      const radial = player.vx*nx + player.vy*ny;
      player.vx -= radial*nx;
      player.vy -= radial*ny;
    }

    // trail
    const speed = Math.hypot(player.vx,player.vy);
    particles.push({x:player.x,y:player.y,life:1, speed});
    if(particles.length>42) particles.shift();
    for(const p of particles) p.life -= 0.045*nDt;
    particles = particles.filter(p=>p.life>0);

    // camera
    camera.x = player.x - W*0.35;
    const targetCamY = player.y - H*0.45;
    camera.y += (targetCamY-camera.y)*clamp(0.09*nDt,0,1);

    // spawn / prune
    while(furthestSpawnX < camera.x + W*1.7) spawnNextCloud();
    if(clouds.length>4) clouds = clouds.filter(c=>c.x > camera.x-400);

    score = Math.max(score, Math.floor((player.x-120)/10));
    scoreVal.textContent = score;
    bestVal.textContent = Math.max(best,score);

    if(shake>0) shake = Math.max(0, shake-nDt*1.2);

    if(player.y - camera.y > H+200){
      triggerGameOver();
    }
  }

  function triggerGameOver(){
    if(state!=='playing') return;
    state='gameover';
    shake = 12;
    playDeathSound();
    best = Math.max(best, score);
    finalScore.textContent = score;
    finalBest.textContent = best;
    hud.style.display='none';
    setTimeout(()=>{ gameOverScreen.classList.remove('hidden'); }, 380);
  }

  // ---------- render ----------
  function skyGradient(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#05000a');
    g.addColorStop(0.6,'#1a001a');
    g.addColorStop(1,'#3d000a');
    return g;
  }

  function draw(t){
    ctx.save();
    if(shake>0){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    ctx.fillStyle = skyGradient();
    ctx.fillRect(0,0,W,H);

    // blood particles (parallax)
    for(const s of stars){
      const sx = ((s.x - camera.x*s.layer) % (W*3) + W*3) % (W*3) - W;
      const alpha = 0.2 + 0.4*Math.sin(t*0.002 + s.tw);
      ctx.fillStyle = `rgba(255,0,60,${clamp(alpha,0.1,0.8)})`;
      ctx.beginPath();
      ctx.arc(sx, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }

    // void fog band
    ctx.save();
    ctx.globalAlpha = 0.15;
    const ag = ctx.createLinearGradient(0,H*0.1,0,H*0.6);
    ag.addColorStop(0,'#ff003c');
    ag.addColorStop(1,'rgba(255,0,60,0)');
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.moveTo(0,H*0.22);
    for(let x=0;x<=W;x+=40){
      ctx.lineTo(x, H*0.22 + Math.sin((x+camera.x*0.2)*0.004 + t*0.0004)*30);
    }
    ctx.lineTo(W,0); ctx.lineTo(0,0); ctx.closePath();
    ctx.fill();
    ctx.restore();

    // cloud entities
    for(const c of clouds){
      const p = worldToScreen(c.x,c.y);
      if(p.x < -120 || p.x > W+120) continue;
      drawCloud(p.x,p.y,c);
    }

    // grapple hint ring
    if(state==='playing' && !grapple.active){
      const hint = findGrappleTarget();
      if(hint){
        const p = worldToScreen(hint.x,hint.y);
        const pulse = 4+Math.sin(t*0.008)*3;
        ctx.strokeStyle = 'rgba(255,0,60,0.85)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(p.x,p.y,hint.r+18+pulse,0,Math.PI*2);
        ctx.stroke();
      }
    }

    // tendril rope
    if(grapple.active && grapple.cloud){
      const a = worldToScreen(grapple.cloud.x, grapple.cloud.y);
      const b = worldToScreen(player.x, player.y);
      ctx.strokeStyle = '#ff003c';
      ctx.lineWidth = 3.5;
      ctx.shadowColor = '#ff003c';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // shadow trail
    for(let i=0;i<particles.length;i++){
      const p = particles[i];
      const s = worldToScreen(p.x,p.y);
      ctx.fillStyle = `rgba(255, 0, 60, ${p.life*0.5})`;
      ctx.beginPath();
      ctx.arc(s.x,s.y, 7*p.life, 0, Math.PI*2);
      ctx.fill();
    }

    // shadow player orb
    if(state!=='start'){
      const p = worldToScreen(player.x,player.y);
      const radius = player.r * player.pulseScale;
      
      // Shadow body
      ctx.fillStyle = '#0a0005';
      ctx.beginPath();
      ctx.arc(p.x,p.y,radius,0,Math.PI*2);
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#ff003c';
      ctx.stroke();

      // Glowing eyes
      ctx.fillStyle = '#ff003c';
      ctx.shadowColor = '#ff003c';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x + 2, p.y - 2, 2.5, 0, Math.PI * 2);
      ctx.arc(p.x + 7, p.y - 2, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  function drawCloud(x,y,c){
    ctx.save();
    const r = c.r + Math.sin(c.pulse)*1.5;

    // Outer dark fog body - Fluffy cloud shape structure
    ctx.fillStyle = '#1a020b';
    ctx.strokeStyle = '#ff003c';
    ctx.lineWidth = 2;

    const cloudPuffs = [
      {dx: 0, dy: 5, rad: r * 0.95},
      {dx: -r * 0.7, dy: 8, rad: r * 0.65},
      {dx: r * 0.7, dy: 8, rad: r * 0.65},
      {dx: -r * 0.4, dy: -r * 0.35, rad: r * 0.7},
      {dx: r * 0.4, dy: -r * 0.35, rad: r * 0.7},
      {dx: 0, dy: -r * 0.5, rad: r * 0.8}
    ];

    // Combine cloud puff silhouettes
    ctx.beginPath();
    for(const puff of cloudPuffs){
      ctx.arc(x + puff.dx, y + puff.dy, puff.rad, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.stroke();

    // Center eye core
    ctx.fillStyle = '#ff003c';
    ctx.beginPath();
    ctx.arc(x, y, r * 0.35, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, r * 0.15, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now){
    const dt = Math.min((now-last)/1000, 0.05);
    last = now;
    if(state==='playing') update(dt);
    draw(now);
    requestAnimationFrame(frame);
  }

  // ---------- UI wiring ----------
  document.getElementById('playBtn').addEventListener('click', ()=>{
    if (audioCtx.state === 'suspended') audioCtx.resume();
    startScreen.classList.add('hidden');
    hud.style.display='flex';
    initGame();
    state='playing';
  });
  document.getElementById('retryBtn').addEventListener('click', ()=>{
    if (audioCtx.state === 'suspended') audioCtx.resume();
    gameOverScreen.classList.add('hidden');
    hud.style.display='flex';
    initGame();
    state='playing';
  });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
