<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overhook - Web Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #71cbf4;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    /* Title Screen */
    #title-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(113, 203, 244, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px;
      z-index: 10;
    }
    .title-box {
      color: #ffffff;
    }
    .title-text {
      font-size: 72px;
      font-weight: 900;
      text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      line-height: 1.1;
    }
    .author-text {
      font-size: 38px;
      font-weight: 800;
      color: #ffffff;
      display: block;
      margin-top: 10px;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
    }
    .start-btn {
      align-self: flex-end;
      background: #ffffff;
      color: #3baee0;
      font-size: 32px;
      font-weight: 900;
      padding: 18px 42px;
      border-radius: 16px;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 0 #2a8cb9, 0 10px 20px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .start-btn:hover {
      transform: translateY(-2px);
    }
    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #2a8cb9;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: none;
      justify-content: space-between;
      pointer-events: none;
      font-weight: 800;
      font-size: 22px;
      color: #fff;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
      z-index: 5;
    }
    .pill {
      background: rgba(0,0,0,0.35);
      padding: 10px 22px;
      border-radius: 30px;
      border: 2px solid rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="title-screen">
    <div class="title-box">
      <div class="title-text">Overhook</div>
      <span class="author-text">by FryedCheese</span>
    </div>
    <button class="start-btn" id="startBtn">Press to start</button>
  </div>

  <div id="hud">
    <div class="pill">LEVEL: <span id="lvlVal">1</span> / 30</div>
    <div class="pill" id="statusVal" style="color: #ffe853;">CLICK & HOLD TO HOOK</div>
    <div class="pill">BOUNCES: <span id="bounceVal">0</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const titleScreen = document.getElementById('title-screen');
const startBtn = document.getElementById('startBtn');
const hud = document.getElementById('hud');
const statusVal = document.getElementById('statusVal');
const lvlVal = document.getElementById('lvlVal');
const bounceVal = document.getElementById('bounceVal');

let gameStarted = false;
let currentLevel = 1;
let cameraX = 0;
let bounceCount = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Mouse state
const mouse = { x: 0, y: 0, isDown: false };
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) {
    mouse.isDown = true;
    if (gameStarted) attachHook();
  }
});

window.addEventListener('mouseup', e => {
  if (e.button === 0) {
    mouse.isDown = false;
    releaseHook();
  }
});

startBtn.addEventListener('click', () => {
  titleScreen.style.display = 'none';
  hud.style.display = 'flex';
  gameStarted = true;
  initLevel(1);
});

// Player
const player = {
  x: 150,
  y: 300,
  vx: 0,
  vy: 0,
  radius: 20,
  color: '#ff4b5c'
};

// Grapple Rope
const rope = {
  attached: false,
  targetStar: null,
  length: 0,
  maxLength: 450
};

let stars = [];
let clouds = [];
let finishLine = { x: 0, width: 45 };

function initLevel(lvl) {
  currentLevel = Math.min(Math.max(1, lvl), 30);
  lvlVal.textContent = currentLevel;
  statusVal.textContent = `LEVEL ${currentLevel} - GO!`;
  
  player.x = 150;
  player.y = canvas.height * 0.4;
  player.vx = 4;
  player.vy = -2;
  cameraX = 0;
  rope.attached = false;

  stars = [];
  clouds = [];

  const starCount = 12 + currentLevel * 3;
  let lastX = 250;

  for (let i = 0; i < starCount; i++) {
    const spacing = 220 + Math.random() * 120 + (currentLevel * 10);
    const starX = lastX + spacing;
    const starY = (canvas.height * 0.25) + Math.sin(i * 0.7 + currentLevel) * (canvas.height * 0.22);
    
    // Slowed down moving speed significantly
    const isMoving = currentLevel > 3 && (Math.random() < 0.45);
    const moveSpeed = isMoving ? 0.0015 + (Math.random() * 0.001) : 0;
    const moveRange = isMoving ? 35 + Math.random() * 45 : 0;

    stars.push({
      baseX: starX,
      baseY: starY,
      x: starX,
      y: starY,
      size: Math.max(18, 26 - Math.floor(currentLevel * 0.25)),
      pulse: Math.random() * Math.PI * 2,
      isMoving: isMoving,
      moveSpeed: moveSpeed,
      moveRange: moveRange,
      offset: Math.random() * 100
    });

    // Unique Randomized Cloud Generation
    const cloudsPerStar = 1 + Math.floor(Math.random() * 2);
    for (let c = 0; c < cloudsPerStar; c++) {
      const w = 90 + Math.random() * 100;
      const h = 30 + Math.random() * 20;
      
      // Generate random fluff circles for distinct cloud silhouettes
      const bumps = [];
      const bumpCount = 3 + Math.floor(Math.random() * 4);
      for (let b = 0; b < bumpCount; b++) {
        bumps.push({
          offsetX: (Math.random() - 0.5) * (w * 0.7),
          offsetY: -h / 2 + (Math.random() * -10),
          radius: 12 + Math.random() * 14
        });
      }

      clouds.push({
        x: starX + (Math.random() * 180 - 90),
        y: Math.min(canvas.height - 80, starY + 110 + Math.random() * 150),
        w: w,
        h: h,
        bumps: bumps,
        color: `hsl(${190 + Math.random() * 20}, ${80 + Math.random() * 20}%, ${95 + Math.random() * 5}%)`,
        bounceSquish: 0
      });
    }

    lastX = starX;
  }

  finishLine.x = lastX + 320;
}

function attachHook() {
  const worldMouseX = mouse.x + cameraX;
  const worldMouseY = mouse.y;

  let closestStar = null;
  let minDist = rope.maxLength;

  stars.forEach(s => {
    const dx = s.x - player.x;
    const dy = s.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < minDist) {
      minDist = dist;
      closestStar = s;
    }
  });

  if (closestStar) {
    rope.attached = true;
    rope.targetStar = closestStar;
    const dx = player.x - closestStar.x;
    const dy = player.y - closestStar.y;
    rope.length = Math.sqrt(dx * dx + dy * dy);
  }
}

function releaseHook() {
  rope.attached = false;
  rope.targetStar = null;
}

function update() {
  if (!gameStarted) return;

  // Gravity
  player.vy += 0.38;

  // Smooth & gentle star motion
  stars.forEach(s => {
    if (s.isMoving) {
      s.y = s.baseY + Math.sin(Date.now() * s.moveSpeed + s.offset) * s.moveRange;
    }
  });

  // Grapple physics
  if (rope.attached && rope.targetStar) {
    if (rope.length > 40) {
      rope.length -= 3.2;
    }

    const dx = player.x - rope.targetStar.x;
    const dy = player.y - rope.targetStar.y;
    const currentDist = Math.sqrt(dx * dx + dy * dy);

    if (currentDist > rope.length) {
      const angle = Math.atan2(dy, dx);
      player.x = rope.targetStar.x + Math.cos(angle) * rope.length;
      player.y = rope.targetStar.y + Math.sin(angle) * rope.length;

      const nx = dx / currentDist;
      const ny = dy / currentDist;
      const dot = player.vx * nx + player.vy * ny;

      player.vx -= dot * nx * 1.03;
      player.vy -= dot * ny * 1.03;
    }
  }

  player.vx *= 0.996;
  player.vy *= 0.996;

  player.x += player.vx;
  player.y += player.vy;

  // Cloud bouncing
  clouds.forEach(c => {
    if (
      player.x + player.radius > c.x - c.w/2 &&
      player.x - player.radius < c.x + c.w/2 &&
      player.y + player.radius >= c.y - c.h/2 &&
      player.y - player.radius <= c.y + c.h/2 &&
      player.vy > 0
    ) {
      player.vy = -13.5;
      player.vx += 2.0;
      c.bounceSquish = 12;
      bounceCount++;
      bounceVal.textContent = bounceCount;
    }

    if (c.bounceSquish > 0) c.bounceSquish -= 1;
  });

  cameraX += (player.x - canvas.width * 0.25 - cameraX) * 0.08;

  // Win condition
  if (player.x + player.radius >= finishLine.x) {
    if (currentLevel < 30) {
      statusVal.textContent = "LEVEL COMPLETE!";
      gameStarted = false;
      setTimeout(() => {
        gameStarted = true;
        initLevel(currentLevel + 1);
      }, 900);
    } else {
      statusVal.textContent = "YOU BEAT ALL 30 LEVELS!";
      gameStarted = false;
    }
  }

  // Fall void
  if (player.y > canvas.height + 150) {
    statusVal.textContent = "FELL INTO THE VOID!";
    gameStarted = false;
    setTimeout(() => {
      gameStarted = true;
      initLevel(currentLevel);
    }, 800);
  }
}

function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
  let rot = Math.PI / 2 * 3;
  let x = cx;
  let y = cy;
  let step = Math.PI / spikes;

  ctx.beginPath();
  ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius;
    y = cy + Math.sin(rot) * outerRadius;
    ctx.lineTo(x, y);
    rot += step;

    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius);
  ctx.closePath();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawCloud(c) {
  ctx.save();
  ctx.translate(c.x - cameraX, c.y + c.bounceSquish);
  ctx.fillStyle = c.color;

  // Base pill platform
  ctx.beginPath();
  ctx.roundRect(-c.w/2, -c.h/2, c.w, c.h, c.h / 2);
  ctx.fill();

  // Draw randomized top fluff bumps
  c.bumps.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.offsetX, b.offsetY, b.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.lineWidth = 3;
  ctx.strokeStyle = '#d0f0ff';
  ctx.stroke();

  ctx.restore();
}

function render() {
  ctx.fillStyle = '#71cbf4';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  clouds.forEach(c => drawCloud(c));

  if (gameStarted || rope.attached) {
    // 40% Opaque Finish Line
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.fillRect(finishLine.x - cameraX, -500, finishLine.width, canvas.height + 1000);
    
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.lineWidth = 4;
    ctx.strokeRect(finishLine.x - cameraX, -500, finishLine.width, canvas.height + 1000);

    // Swing Stars
    stars.forEach(s => {
      s.pulse += 0.05;
      const pulseRadius = s.size + Math.sin(s.pulse) * 2;
      drawStar(s.x - cameraX, s.y, 5, pulseRadius, pulseRadius / 2, '#ffea00');
    });

    // Grapple rope
    if (rope.attached && rope.targetStar) {
      ctx.beginPath();
      ctx.moveTo(player.x - cameraX, player.y);
      ctx.lineTo(rope.targetStar.x - cameraX, rope.targetStar.y);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // Red Player Ball
    ctx.beginPath();
    ctx.arc(player.x - cameraX, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    // Shine
    ctx.beginPath();
    ctx.arc(player.x - cameraX - 6, player.y - 6, 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fill();
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
