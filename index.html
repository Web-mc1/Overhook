<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overhook - Web Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #71cbf4;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    /* Title Screen */
    #title-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(113, 203, 244, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px;
      z-index: 10;
    }
    .title-box {
      color: #ffffff;
    }
    .title-text {
      font-size: 72px;
      font-weight: 900;
      text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      line-height: 1.1;
    }
    .author-text {
      font-size: 38px;
      font-weight: 800;
      color: #ffffff;
      display: block;
      margin-top: 10px;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
    }
    .start-btn {
      align-self: flex-end;
      background: #ffffff;
      color: #3baee0;
      font-size: 32px;
      font-weight: 900;
      padding: 18px 42px;
      border-radius: 16px;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 0 #2a8cb9, 0 10px 20px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .start-btn:hover {
      transform: translateY(-2px);
    }
    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #2a8cb9;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: none;
      justify-content: space-between;
      pointer-events: none;
      font-weight: 800;
      font-size: 22px;
      color: #fff;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
      z-index: 5;
    }
    .pill {
      background: rgba(0,0,0,0.35);
      padding: 10px 22px;
      border-radius: 30px;
      border: 2px solid rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>

<div id="game-container">
  <audio id="bgMusic" src="HiLau - 1984 (freetouse.com).mp3" loop></audio>

  <div id="title-screen">
    <div class="title-box">
      <div class="title-text">Overhook</div>
      <span class="author-text">by FryedCheese</span>
    </div>
    <button class="start-btn" id="startBtn">Press to start</button>
  </div>

  <div id="hud">
    <div class="pill">LEVEL: <span id="lvlVal">1</span> / 30</div>
    <div class="pill" id="statusVal" style="color: #ffe853;">CLICK FAST TO REEL IN & BOOST YOUR SWING!</div>
    <div class="pill">BOUNCES: <span id="bounceVal">0</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>
</div>

<script>
// WEB AUDIO API ENGINE SETUP FOR SOUND EFFECTS
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const bgMusic = document.getElementById('bgMusic');

function playBounceSound() {
  if (audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(160, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.14);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.14);
}

function playHookSound() {
  if (audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(750, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.09);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.09);
}

function playReelSound() {
  if (audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(500, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.05);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

function playWinSound() {
  if (audioCtx.state !== 'running') return;
  const notes = [300, 400, 500, 700];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.08);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.08);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.08 + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + i * 0.08);
    osc.stop(audioCtx.currentTime + i * 0.08 + 0.12);
  });
}

// GAME CODE
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const titleScreen = document.getElementById('title-screen');
const startBtn = document.getElementById('startBtn');
const hud = document.getElementById('hud');
const statusVal = document.getElementById('statusVal');
const lvlVal = document.getElementById('lvlVal');
const bounceVal = document.getElementById('bounceVal');

let gameStarted = false;
let currentLevel = 1;
let cameraX = 0;
let bounceCount = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Reel In & Speed Boost Controls
let releaseTimeout = null;

function triggerReelIn() {
  if (rope.attached && rope.targetStar) {
    // 1. Reel closer by 20 pixels per click
    if (rope.length > 20) {
      rope.length -= 20;
    }

    // 2. Add swing force on every click!
    const dx = player.x - rope.targetStar.x;
    const dy = player.y - rope.targetStar.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 0) {
      let perpX = -dy / dist;
      let perpY = dx / dist;

      const currentDot = player.vx * perpX + player.vy * perpY;
      if (currentDot < 0) {
        perpX = -perpX;
        perpY = -perpY;
      }

      player.vx += perpX * 3.8;
      player.vy += perpY * 3.8;
    }

    playReelSound();
  }
}

const mouse = { x: 0, y: 0, isDown: false };
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) { // Left Click
    mouse.isDown = true;
    
    clearTimeout(releaseTimeout);

    if (gameStarted) {
      if (!rope.attached) {
        attachHook();
      } else {
        triggerReelIn();
      }
    }
  }
});

window.addEventListener('mouseup', e => {
  if (e.button === 0) {
    mouse.isDown = false;
    
    clearTimeout(releaseTimeout);
    releaseTimeout = setTimeout(() => {
      releaseHook();
    }, 250);
  }
});

// Prevent Context Menu
window.addEventListener('contextmenu', e => e.preventDefault());

startBtn.addEventListener('click', () => {
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  bgMusic.volume = 0.35;
  bgMusic.play().catch(e => console.log("Music play blocked by browser:", e));

  titleScreen.style.display = 'none';
  hud.style.display = 'flex';
  gameStarted = true;
  initLevel(1);
});

// Player
const player = {
  x: 150,
  y: 300,
  vx: 0,
  vy: 0,
  radius: 20,
  color: '#ff4b5c'
};

// Grapple Rope
const rope = {
  attached: false,
  targetStar: null,
  length: 0,
  maxLength: 580
};

let stars = [];
let clouds = [];
let finishLine = { x: 0, width: 45 };

function initLevel(lvl) {
  currentLevel = Math.min(Math.max(1, lvl), 30);
  lvlVal.textContent = currentLevel;
  statusVal.textContent = `LEVEL ${currentLevel} - GO!`;
  
  const spawnX = 150;
  const spawnY = canvas.height * 0.5;

  player.x = spawnX;
  player.y = spawnY - 30;
  player.vx = 0;
  player.vy = 0;
  cameraX = 0;
  rope.attached = false;

  stars = [];
  clouds = [];

  // Spawn Cloud
  clouds.push({
    x: spawnX,
    y: spawnY,
    w: 160,
    h: 35,
    bumps: [
      { offsetX: -30, offsetY: -18, radius: 14 },
      { offsetX: 0, offsetY: -20, radius: 16 },
      { offsetX: 30, offsetY: -18, radius: 14 }
    ],
    color: '#ffffff',
    bounceSquish: 0
  });

  const starCount = 10 + currentLevel * 2;
  let lastX = 280;

  for (let i = 0; i < starCount; i++) {
    const spacing = 240 + Math.random() * 100 + (currentLevel * 5);
    const starX = lastX + spacing;
    const starY = (canvas.height * 0.28) + Math.sin(i * 0.7 + currentLevel) * (canvas.height * 0.18);
    
    const isMoving = currentLevel > 5 && (Math.random() < 0.35);
    const moveSpeed = isMoving ? 0.0012 + (Math.random() * 0.001) : 0;
    const moveRange = isMoving ? 25 + Math.random() * 35 : 0;

    stars.push({
      baseX: starX,
      baseY: starY,
      x: starX,
      y: starY,
      size: Math.max(22, 30 - Math.floor(currentLevel * 0.2)),
      pulse: Math.random() * Math.PI * 2,
      isMoving: isMoving,
      moveSpeed: moveSpeed,
      moveRange: moveRange,
      offset: Math.random() * 100
    });

    if (Math.random() > 0.35) {
      const w = 110 + Math.random() * 60;
      const h = 32 + Math.random() * 15;
      const cloudX = starX + (Math.random() * 40 - 20);
      const cloudY = Math.min(canvas.height - 60, starY + 150 + Math.random() * 70);

      let overlaps = false;
      for (let existing of clouds) {
        const dx = Math.abs(existing.x - cloudX);
        const dy = Math.abs(existing.y - cloudY);
        if (dx < (existing.w / 2 + w / 2 + 40) && dy < (existing.h / 2 + h / 2 + 30)) {
          overlaps = true;
          break;
        }
      }

      if (!overlaps) {
        const bumps = [];
        const bumpCount = 3 + Math.floor(Math.random() * 3);
        for (let b = 0; b < bumpCount; b++) {
          bumps.push({
            offsetX: (Math.random() - 0.5) * (w * 0.7),
            offsetY: -h / 2 + (Math.random() * -8),
            radius: 10 + Math.random() * 12
          });
        }

        clouds.push({
          x: cloudX,
          y: cloudY,
          w: w,
          h: h,
          bumps: bumps,
          color: `hsl(${190 + Math.random() * 20}, ${80 + Math.random() * 20}%, ${95 + Math.random() * 5}%)`,
          bounceSquish: 0
        });
      }
    }

    lastX = starX;
  }

  finishLine.x = lastX + 300;
}

function attachHook() {
  let closestStar = null;
  let minDist = rope.maxLength;

  stars.forEach(s => {
    const dx = s.x - player.x;
    const dy = s.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < minDist) {
      minDist = dist;
      closestStar = s;
    }
  });

  if (closestStar) {
    rope.attached = true;
    rope.targetStar = closestStar;
    const dx = player.x - closestStar.x;
    const dy = player.y - closestStar.y;
    rope.length = Math.sqrt(dx * dx + dy * dy);
    playHookSound();
  }
}

function releaseHook() {
  clearTimeout(releaseTimeout);
  rope.attached = false;
  rope.targetStar = null;
}

function update() {
  if (!gameStarted) return;

  player.vy += 0.28;

  stars.forEach(s => {
    if (s.isMoving) {
      s.y = s.baseY + Math.sin(Date.now() * s.moveSpeed + s.offset) * s.moveRange;
    }
  });

  if (rope.attached && rope.targetStar) {
    const dx = player.x - rope.targetStar.x;
    const dy = player.y - rope.targetStar.y;
    const currentDist = Math.sqrt(dx * dx + dy * dy);

    if (currentDist > rope.length) {
      const angle = Math.atan2(dy, dx);
      player.x = rope.targetStar.x + Math.cos(angle) * rope.length;
      player.y = rope.targetStar.y + Math.sin(angle) * rope.length;

      const nx = dx / currentDist;
      const ny = dy / currentDist;
      const dot = player.vx * nx + player.vy * ny;

      player.vx -= dot * nx * 1.03;
      player.vy -= dot * ny * 1.03;
    }
  }

  player.vx *= 0.997;
  player.vy *= 0.997;

  player.x += player.vx;
  player.y += player.vy;

  clouds.forEach(c => {
    if (
      player.x + player.radius > c.x - c.w / 2 &&
      player.x - player.radius < c.x + c.w / 2 &&
      player.y + player.radius >= c.y - c.h / 2 &&
      player.y - player.radius <= c.y + c.h / 2
    ) {
      if (player.y > c.y && player.vy < 0) {
        player.vy = 14.5;
      } else {
        player.vy = -14.5;
      }

      player.vx += player.vx >= 0 ? 2.5 : -2.5;
      c.bounceSquish = 12;
      bounceCount++;
      bounceVal.textContent = bounceCount;
      playBounceSound();
    }

    if (c.bounceSquish > 0) c.bounceSquish -= 1;
  });

  cameraX += (player.x - canvas.width * 0.25 - cameraX) * 0.08;

  if (player.x + player.radius >= finishLine.x) {
    playWinSound();
    if (currentLevel < 30) {
      statusVal.textContent = "LEVEL COMPLETE!";
      gameStarted = false;
      setTimeout(() => {
        gameStarted = true;
        initLevel(currentLevel + 1);
      }, 900);
    } else {
      statusVal.textContent = "YOU BEAT ALL 30 LEVELS!";
      gameStarted = false;
    }
  }

  if (player.y > canvas.height + 250) {
    statusVal.textContent = "FELL INTO THE VOID!";
    gameStarted = false;
    setTimeout(() => {
      gameStarted = true;
      initLevel(currentLevel);
    }, 800);
  }
}

function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
  let rot = Math.PI / 2 * 3;
  let x = cx;
  let y = cy;
  let step = Math.PI / spikes;

  ctx.beginPath();
  ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius;
    y = cy + Math.sin(rot) * outerRadius;
    ctx.lineTo(x, y);
    rot += step;

    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius);
  ctx.closePath();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawCloud(c) {
  ctx.save();
  ctx.translate(c.x - cameraX, c.y + c.bounceSquish);
  ctx.fillStyle = c.color;

  ctx.beginPath();
  ctx.roundRect(-c.w/2, -c.h/2, c.w, c.h, c.h / 2);
  ctx.fill();

  c.bumps.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.offsetX, b.offsetY, b.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.lineWidth = 3;
  ctx.strokeStyle = '#d0f0ff';
  ctx.stroke();

  ctx.restore();
}

function render() {
  ctx.fillStyle = '#71cbf4';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  clouds.forEach(c => drawCloud(c));

  if (gameStarted || rope.attached) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.fillRect(finishLine.x - cameraX, -500, finishLine.width, canvas.height + 1000);
    
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.lineWidth = 4;
    ctx.strokeRect(finishLine.x - cameraX, -500, finishLine.width, canvas.height + 1000);

    stars.forEach(s => {
      s.pulse += 0.05;
      const pulseRadius = s.size + Math.sin(s.pulse) * 2;
      drawStar(s.x - cameraX, s.y, 5, pulseRadius, pulseRadius / 2, '#ffea00');
    });

    if (rope.attached && rope.targetStar) {
      ctx.beginPath();
      ctx.moveTo(player.x - cameraX, player.y);
      ctx.lineTo(rope.targetStar.x - cameraX, rope.targetStar.y);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(player.x - cameraX, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(player.x - cameraX - 6, player.y - 6, 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fill();
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
