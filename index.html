<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overhook - Pixel Sky Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #00b4ff;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    /* ENHANCED TITLE SCREEN */
    #title-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, #0099ff 0%, #33c3ff 60%, #b3ecff 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 60px 40px;
      z-index: 10;
      overflow: hidden;
    }

    /* Ambient Floating Clouds for Menu */
    .menu-cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50px;
      pointer-events: none;
      animation: floatCloud linear infinite;
    }
    .menu-cloud::before, .menu-cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
    }
    .menu-cloud-1 { width: 180px; height: 50px; top: 15%; left: -200px; animation-duration: 22s; }
    .menu-cloud-1::before { width: 70px; height: 70px; top: -30px; left: 30px; }
    .menu-cloud-1::after { width: 50px; height: 50px; top: -20px; left: 90px; }

    .menu-cloud-2 { width: 240px; height: 65px; top: 60%; left: -250px; animation-duration: 16s; animation-delay: 5s; }
    .menu-cloud-2::before { width: 90px; height: 90px; top: -40px; left: 40px; }
    .menu-cloud-2::after { width: 70px; height: 70px; top: -25px; left: 120px; }

    @keyframes floatCloud {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(100vw + 300px)); }
    }

    .title-box {
      text-align: center;
      margin-top: 40px;
      z-index: 2;
    }
    .title-text {
      font-size: 88px;
      font-weight: 900;
      color: #ffea00;
      text-shadow: 
        6px 6px 0 #000, 
        -4px -4px 0 #000, 
        4px -4px 0 #000, 
        -4px 4px 0 #000,
        0 10px 20px rgba(0,0,0,0.3);
      line-height: 1;
      letter-spacing: 6px;
      transform: rotate(-2deg);
      animation: titleBounce 2s ease-in-out infinite alternate;
    }
    @keyframes titleBounce {
      0% { transform: rotate(-2deg) translateY(0px); }
      100% { transform: rotate(-2deg) translateY(-8px); }
    }

    .author-badge {
      display: inline-block;
      margin-top: 20px;
      background: #000000;
      color: #ffffff;
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }
    .author-badge span {
      color: #ffea00;
    }

    .best-score-box {
      margin-top: 15px;
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 2px 2px 0 #000;
      background: rgba(0,0,0,0.4);
      padding: 8px 18px;
      border-radius: 12px;
      border: 2px solid #ffffff;
      display: inline-block;
    }

    .start-btn {
      z-index: 2;
      background: #ffea00;
      color: #000000;
      font-size: 36px;
      font-weight: 900;
      padding: 20px 50px;
      border-radius: 16px;
      border: 5px solid #000000;
      box-shadow: 0 10px 0 #000000, 0 15px 25px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: 40px;
      animation: btnPulse 1.5s infinite alternate;
    }
    @keyframes btnPulse {
      0% { box-shadow: 0 10px 0 #000000, 0 0 0 rgba(255,234,0,0.4); }
      100% { box-shadow: 0 10px 0 #000000, 0 0 25px rgba(255,234,0,0.8); }
    }
    .start-btn:hover {
      transform: translateY(-4px);
      background: #fff04d;
    }
    .start-btn:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #000000;
    }

    /* Pixel Art HUD */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: none;
      justify-content: space-between;
      pointer-events: none;
      font-weight: 900;
      font-size: 20px;
      color: #fff;
      z-index: 5;
    }
    .pill {
      background: rgba(0,0,0,0.8);
      padding: 10px 20px;
      border-radius: 20px;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 0 #000;
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <audio id="bgMusic" src="HiLau - 1984 (freetouse.com).mp3" loop></audio>

  <div id="title-screen">
    <div class="menu-cloud menu-cloud-1"></div>
    <div class="menu-cloud menu-cloud-2"></div>

    <div class="title-box">
      <div class="title-text">OVERHOOK</div>
      <div class="author-badge">BY <span>FRYEDCHEESE</span></div>
      <br>
      <div class="best-score-box" id="bestScoreBox">BEST TIME: --:--.--</div>
    </div>
    
    <button class="start-btn" id="startBtn">PRESS TO START</button>
  </div>

  <div id="hud">
    <div class="pill">LVL: <span id="lvlVal">1</span>/30</div>
    <div class="pill" style="color: #ffea00;">TIME: <span id="timerVal">00:00.00</span></div>
    <div class="pill" id="statusVal" style="color: #ffe853;">CLICK TO REEL IN!</div>
    <div class="pill">BOUNCES: <span id="bounceVal">0</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>
</div>

<script>
// OPTIMIZATION CONSTANTS
const TWO_PI = Math.PI * 2;
const HALF_PI = Math.PI / 2;

// WEB AUDIO API ENGINE SETUP
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const bgMusic = document.getElementById('bgMusic');

function playBounceSound() {
  if (audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  osc.type = 'sine';
  osc.frequency.setValueAtTime(160, now);
  osc.frequency.exponentialRampToValueAtTime(450, now + 0.14);
  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.14);
}

function playHookSound() {
  if (audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(750, now);
  osc.frequency.exponentialRampToValueAtTime(220, now + 0.09);
  gain.gain.setValueAtTime(0.25, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.09);
}

function playReelSound() {
  if (audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  osc.type = 'square';
  osc.frequency.setValueAtTime(600, now);
  osc.frequency.exponentialRampToValueAtTime(1100, now + 0.06);
  gain.gain.setValueAtTime(0.15, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.06);
}

function playWinSound() {
  if (audioCtx.state !== 'running') return;
  const notes = [300, 400, 500, 700];
  const now = audioCtx.currentTime;
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const time = now + i * 0.08;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(0.2, time);
    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.12);
  });
}

// GAME CODE
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

const titleScreen = document.getElementById('title-screen');
const startBtn = document.getElementById('startBtn');
const bestScoreBox = document.getElementById('bestScoreBox');
const hud = document.getElementById('hud');
const statusVal = document.getElementById('statusVal');
const lvlVal = document.getElementById('lvlVal');
const bounceVal = document.getElementById('bounceVal');
const timerVal = document.getElementById('timerVal');

let gameStarted = false;
let currentLevel = 1;
let cameraX = 0;
let bounceCount = 0;

// STOPWATCH VARIABLES
let startTime = 0;
let elapsedTime = 0;
let timerRunning = false;
let finalTimeFormatted = "";

function formatTime(ms) {
  const totalSeconds = (ms / 1000) | 0;
  const minutes = (totalSeconds / 60) | 0;
  const seconds = totalSeconds % 60;
  const centiseconds = ((ms % 1000) / 10) | 0;

  const mStr = minutes < 10 ? '0' + minutes : minutes;
  const sStr = seconds < 10 ? '0' + seconds : seconds;
  const cStr = centiseconds < 10 ? '0' + centiseconds : centiseconds;

  return `${mStr}:${sStr}.${cStr}`;
}

// Display Saved PB on Startup
const savedBest = localStorage.getItem('overhook_best_time');
if (savedBest) {
  bestScoreBox.textContent = `BEST TIME: ${formatTime(parseInt(savedBest))}`;
}

function updateStopwatch() {
  if (timerRunning) {
    elapsedTime = Date.now() - startTime;
    timerVal.textContent = formatTime(elapsedTime);
  }
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Reel In Controls
function triggerReelIn() {
  if (rope.attached && rope.targetStar) {
    const dx = rope.targetStar.x - player.x;
    const dy = rope.targetStar.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 15) {
      const pullForce = 12.0;
      player.vx += (dx / dist) * pullForce;
      player.vy += (dy / dist) * pullForce;
      
      rope.length = Math.max(15, dist - 60);
      rope.targetLength = rope.length;
    }

    playReelSound();
  }
}

canvas.addEventListener('mousedown', e => {
  if (e.button === 0 && gameStarted) {
    if (!rope.attached) {
      attachHook();
    } else {
      triggerReelIn();
    }
  }
});

window.addEventListener('mouseup', e => {
  if (e.button === 0) {
    releaseHook();
  }
});

window.addEventListener('contextmenu', e => e.preventDefault());

startBtn.addEventListener('click', () => {
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  bgMusic.volume = 0.35;
  bgMusic.play().catch(e => console.log("Music play blocked by browser:", e));

  titleScreen.style.display = 'none';
  hud.style.display = 'flex';
  gameStarted = true;

  startTime = Date.now();
  elapsedTime = 0;
  timerRunning = true;

  initLevel(1);
});

// Player
const player = {
  x: 150,
  y: 300,
  vx: 0,
  vy: 0,
  radius: 22,
  color: '#ff3b30'
};

// Grapple Rope
const rope = {
  attached: false,
  targetStar: null,
  length: 0,
  targetLength: 0,
  maxLength: 580
};

let stars = [];
let clouds = [];
let birds = [];
let cloudTrails = [];
let lastBirdSpawn = 0;
let finishLine = { x: 0, width: 90 };

function spawnBird() {
  const direction = Math.random() < 0.5 ? 1 : -1;
  const startX = direction === 1 ? cameraX - 100 : cameraX + canvas.width + 100;
  const startY = 60 + Math.random() * (canvas.height * 0.4);

  birds.push({
    x: startX,
    y: startY,
    speed: (2 + Math.random() * 2.5) * direction,
    wingAngle: Math.random() * Math.PI,
    size: 16 + Math.random() * 10,
    flapSpeed: 0.15 + Math.random() * 0.1,
    type: (Math.random() * 3) | 0
  });
}

function initLevel(lvl) {
  currentLevel = Math.min(Math.max(1, lvl), 30);
  lvlVal.textContent = currentLevel;
  statusVal.textContent = `LEVEL ${currentLevel} - GO!`;
  
  const spawnX = 150;
  const spawnY = canvas.height * 0.5;

  player.x = spawnX;
  player.y = spawnY - 30;
  player.vx = 0;
  player.vy = 0;
  cameraX = 0;
  rope.attached = false;

  stars = [];
  clouds = [];
  birds = [];
  cloudTrails = [];

  for (let t = 0; t < 6; t++) {
    cloudTrails.push({
      x: 100 + t * 650,
      y: 120 + (t % 3) * 120,
      radiusX: 180 + Math.random() * 100,
      radiusY: 40 + Math.random() * 30,
      rotation: (Math.random() - 0.5) * 0.3
    });
  }

  for (let b = 0; b < 5; b++) {
    spawnBird();
  }

  clouds.push({
    x: spawnX,
    y: spawnY,
    w: 170,
    h: 38,
    bumps: [
      { offsetX: -40, offsetY: -16, radius: 20 },
      { offsetX: 0, offsetY: -22, radius: 24 },
      { offsetX: 40, offsetY: -16, radius: 20 }
    ],
    color: '#ffffff',
    bounceSquish: 0
  });

  const starCount = 10 + currentLevel * 2;
  let lastX = 280;

  for (let i = 0; i < starCount; i++) {
    const spacing = 240 + Math.random() * 100 + (currentLevel * 5);
    const starX = lastX + spacing;
    const starY = (canvas.height * 0.28) + Math.sin(i * 0.7 + currentLevel) * (canvas.height * 0.18);
    
    const isMoving = currentLevel > 5 && (Math.random() < 0.35);
    const moveSpeed = isMoving ? 0.0012 + (Math.random() * 0.001) : 0;
    const moveRange = isMoving ? 25 + Math.random() * 35 : 0;

    stars.push({
      baseX: starX,
      baseY: starY,
      x: starX,
      y: starY,
      size: Math.max(22, 30 - ((currentLevel * 0.2) | 0)),
      pulse: Math.random() * TWO_PI,
      isMoving: isMoving,
      moveSpeed: moveSpeed,
      moveRange: moveRange,
      offset: Math.random() * 100
    });

    if (Math.random() > 0.35) {
      const w = 110 + Math.random() * 60;
      const h = 32 + Math.random() * 15;
      const cloudX = starX + (Math.random() * 40 - 20);
      const cloudY = Math.min(canvas.height - 80, starY + 150 + Math.random() * 70);

      let overlaps = false;
      for (let existing of clouds) {
        const dx = Math.abs(existing.x - cloudX);
        const dy = Math.abs(existing.y - cloudY);
        if (dx < (existing.w / 2 + w / 2 + 40) && dy < (existing.h / 2 + h / 2 + 30)) {
          overlaps = true;
          break;
        }
      }

      if (!overlaps) {
        const bumps = [];
        const bumpCount = 3 + ((Math.random() * 3) | 0);
        for (let b = 0; b < bumpCount; b++) {
          bumps.push({
            offsetX: (Math.random() - 0.5) * (w * 0.7),
            offsetY: -h / 2 + (Math.random() * -6),
            radius: 12 + Math.random() * 10
          });
        }

        clouds.push({
          x: cloudX,
          y: cloudY,
          w: w,
          h: h,
          bumps: bumps,
          color: '#ffffff',
          bounceSquish: 0
        });
      }
    }

    lastX = starX;
  }

  finishLine.x = lastX + 300;
}

function attachHook() {
  let closestStar = null;
  let minDist = rope.maxLength;

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const dx = s.x - player.x;
    const dy = s.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < minDist) {
      minDist = dist;
      closestStar = s;
    }
  }

  if (closestStar) {
    rope.attached = true;
    rope.targetStar = closestStar;
    const dx = player.x - closestStar.x;
    const dy = player.y - closestStar.y;
    rope.length = Math.sqrt(dx * dx + dy * dy);
    rope.targetLength = rope.length;
    playHookSound();
  }
}

function releaseHook() {
  rope.attached = false;
  rope.targetStar = null;
}

function update() {
  if (!gameStarted) return;

  updateStopwatch();

  player.vy += 0.28;

  const now = Date.now();

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    if (s.isMoving) {
      s.y = s.baseY + Math.sin(now * s.moveSpeed + s.offset) * s.moveRange;
    }
  }

  if (now - lastBirdSpawn > 3500) {
    if (birds.length < 10) {
      spawnBird();
    }
    lastBirdSpawn = now;
  }

  for (let idx = birds.length - 1; idx >= 0; idx--) {
    const b = birds[idx];
    b.x += b.speed;
    b.wingAngle += b.flapSpeed;

    if (b.x < cameraX - 250 || b.x > cameraX + canvas.width + 250) {
      birds.splice(idx, 1);
    }
  }

  if (rope.attached && rope.targetStar) {
    const dx = player.x - rope.targetStar.x;
    const dy = player.y - rope.targetStar.y;
    const currentDist = Math.sqrt(dx * dx + dy * dy);

    if (currentDist > rope.length) {
      const angle = Math.atan2(dy, dx);
      player.x = rope.targetStar.x + Math.cos(angle) * rope.length;
      player.y = rope.targetStar.y + Math.sin(angle) * rope.length;

      const nx = dx / currentDist;
      const ny = dy / currentDist;
      const dot = player.vx * nx + player.vy * ny;

      player.vx -= dot * nx * 1.03;
      player.vy -= dot * ny * 1.03;
    }
  }

  player.vx *= 0.997;
  player.vy *= 0.997;

  player.x += player.vx;
  player.y += player.vy;

  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    if (
      player.x + player.radius > c.x - c.w / 2 &&
      player.x - player.radius < c.x + c.w / 2 &&
      player.y + player.radius >= c.y - c.h / 2 &&
      player.y - player.radius <= c.y + c.h / 2
    ) {
      if (player.y > c.y && player.vy < 0) {
        player.vy = 14.5;
      } else {
        player.vy = -14.5;
      }

      player.vx += player.vx >= 0 ? 2.5 : -2.5;
      c.bounceSquish = 12;
      bounceCount++;
      bounceVal.textContent = bounceCount;
      playBounceSound();
    }

    if (c.bounceSquish > 0) c.bounceSquish -= 1;
  }

  cameraX += (player.x - canvas.width * 0.25 - cameraX) * 0.08;

  if (player.x + player.radius >= finishLine.x) {
    playWinSound();

    if (currentLevel < 30) {
      statusVal.textContent = "LEVEL COMPLETE!";
      gameStarted = false;
      setTimeout(() => {
        gameStarted = true;
        initLevel(currentLevel + 1);
      }, 900);
    } else {
      timerRunning = false;
      finalTimeFormatted = formatTime(elapsedTime);

      const storedBest = localStorage.getItem('overhook_best_time');
      let isNewPB = false;
      if (!storedBest || elapsedTime < parseInt(storedBest)) {
        localStorage.setItem('overhook_best_time', elapsedTime);
        isNewPB = true;
      }

      statusVal.textContent = isNewPB 
        ? `NEW RECORD! WIN TIME: ${finalTimeFormatted}`
        : `YOU WIN! TIME: ${finalTimeFormatted}`;

      gameStarted = false;
    }
  }

  if (player.y > canvas.height + 250) {
    statusVal.textContent = "FELL INTO THE VOID!";
    gameStarted = false;
    setTimeout(() => {
      gameStarted = true;
      initLevel(currentLevel);
    }, 800);
  }
}

// DRAWING FUNCTIONS FOR PIXEL BACKGROUND
function drawSkyGradient() {
  const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, '#00b4ff');
  gradient.addColorStop(0.5, '#5cd3ff');
  gradient.addColorStop(0.85, '#d4f4ff');
  gradient.addColorStop(1, '#66a2e8');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawCloudTrails() {
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';

  for (let i = 0; i < cloudTrails.length; i++) {
    const t = cloudTrails[i];
    const renderX = t.x - cameraX * 0.3;
    ctx.beginPath();
    ctx.ellipse(renderX, t.y, t.radiusX, t.radiusY, t.rotation, 0, Math.PI * 1.8);
    ctx.stroke();
  }

  ctx.restore();
}

function drawBottomCloudOcean() {
  const baseY = canvas.height - 40;
  
  ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  const offset1 = (cameraX * 0.15) % 110;
  for (let x = -100; x < canvas.width + 200; x += 110) {
    ctx.beginPath();
    ctx.arc(x - offset1, baseY - 40, 75, 0, TWO_PI);
    ctx.fill();
  }

  ctx.fillStyle = '#ffffff';
  const offset2 = (cameraX * 0.3) % 90;
  for (let x = -100; x < canvas.width + 200; x += 90) {
    ctx.beginPath();
    ctx.arc(x - offset2, baseY, 65, 0, TWO_PI);
    ctx.fill();
  }
}

const bodyColors = ['#ffffff', '#7a8288', '#a87343'];
const wingColors = ['#2c3e50', '#4a5157', '#5c3a1e'];

function drawBird(b) {
  ctx.save();
  ctx.translate(b.x - cameraX, b.y);
  
  if (b.speed < 0) {
    ctx.scale(-1, 1);
  }

  const wingY = Math.sin(b.wingAngle) * b.size * 0.7;

  ctx.fillStyle = bodyColors[b.type];
  ctx.beginPath();
  ctx.ellipse(0, 0, b.size, b.size * 0.55, 0, 0, TWO_PI);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000000';
  ctx.stroke();

  ctx.fillStyle = wingColors[b.type];
  ctx.beginPath();
  ctx.moveTo(-b.size * 0.3, 0);
  ctx.quadraticCurveTo(0, -b.size + wingY, b.size * 0.7, -b.size * 0.2);
  ctx.quadraticCurveTo(0, wingY * 0.5, -b.size * 0.3, 0);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.arc(b.size * 0.5, -b.size * 0.1, 2, 0, TWO_PI);
  ctx.fill();

  ctx.fillStyle = '#ffaa00';
  ctx.beginPath();
  ctx.moveTo(b.size * 0.8, -2);
  ctx.lineTo(b.size * 0.8 + 8, 1);
  ctx.lineTo(b.size * 0.8, 4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
  let rot = HALF_PI * 3;
  let x = cx;
  let y = cy;
  let step = Math.PI / spikes;

  ctx.beginPath();
  ctx.arc(cx, cy, outerRadius * 1.5, 0, TWO_PI);
  ctx.fillStyle = 'rgba(255, 234, 0, 0.25)';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius;
    y = cy + Math.sin(rot) * outerRadius;
    ctx.lineTo(x, y);
    rot += step;

    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius);
  ctx.closePath();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#000000';
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawCloud(c) {
  ctx.save();
  ctx.translate(c.x - cameraX, c.y + c.bounceSquish);

  const path = new Path2D();
  path.roundRect(-c.w / 2, -c.h / 2, c.w, c.h, c.h / 2);
  for (let i = 0; i < c.bumps.length; i++) {
    const b = c.bumps[i];
    path.arc(b.offsetX, b.offsetY, b.radius, 0, TWO_PI);
  }

  ctx.fillStyle = c.color;
  ctx.fill(path);

  ctx.lineWidth = 3.5;
  ctx.strokeStyle = '#000000';
  ctx.stroke(path);

  ctx.restore();
}

function drawFinishLine() {
  const fx = finishLine.x - cameraX;
  const fw = finishLine.width;

  ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.fillRect(fx, -500, fw, canvas.height + 1000);

  const tileSize = 22;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  for (let y = 0; y < canvas.height; y += tileSize) {
    for (let x = 0; x < fw; x += tileSize) {
      if ((((x / tileSize) | 0) + ((y / tileSize) | 0)) % 2 === 0) {
        ctx.fillRect(fx + x, y, tileSize, tileSize);
      }
    }
  }

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 6;
  ctx.strokeRect(fx, -500, fw, canvas.height + 1000);
}

function render() {
  drawSkyGradient();
  drawCloudTrails();
  for (let i = 0; i < birds.length; i++) drawBird(birds[i]);
  drawBottomCloudOcean();

  if (gameStarted || rope.attached) {
    drawFinishLine();
    for (let i = 0; i < clouds.length; i++) drawCloud(clouds[i]);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.pulse += 0.05;
      const pulseRadius = s.size + Math.sin(s.pulse) * 2;
      drawStar(s.x - cameraX, s.y, 5, pulseRadius, pulseRadius / 2, '#ffea00');
    }

    if (rope.attached && rope.targetStar) {
      ctx.beginPath();
      ctx.moveTo(player.x - cameraX, player.y);
      ctx.lineTo(rope.targetStar.x - cameraX, rope.targetStar.y);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(player.x - cameraX, player.y, player.radius, 0, TWO_PI);
    ctx.fillStyle = player.color;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#000000';
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(player.x - cameraX - 4, player.y - 4, 6, 0, TWO_PI);
    ctx.arc(player.x - cameraX + 6, player.y - 4, 6, 0, TWO_PI);
    ctx.fill();

    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(player.x - cameraX - 2, player.y - 4, 3, 0, TWO_PI);
    ctx.arc(player.x - cameraX + 8, player.y - 4, 3, 0, TWO_PI);
    ctx.fill();
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
