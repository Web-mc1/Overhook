<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overhook - Pixel Sky Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #00b4ff;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    /* Title Screen */
    #title-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 180, 255, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px;
      z-index: 10;
    }
    .title-box {
      color: #ffffff;
    }
    .title-text {
      font-size: 72px;
      font-weight: 900;
      text-shadow: 5px 5px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      line-height: 1.1;
      letter-spacing: 2px;
    }
    .author-text {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      display: block;
      margin-top: 10px;
      text-shadow: 3px 3px 0 #000;
    }
    .start-btn {
      align-self: flex-end;
      background: #ffea00;
      color: #000000;
      font-size: 32px;
      font-weight: 900;
      padding: 18px 42px;
      border-radius: 12px;
      border: 4px solid #000000;
      box-shadow: 0 8px 0 #000000;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .start-btn:hover {
      transform: translateY(-2px);
    }
    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #000000;
    }

    /* Pixel Art HUD */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: none;
      justify-content: space-between;
      pointer-events: none;
      font-weight: 900;
      font-size: 20px;
      color: #fff;
      z-index: 5;
    }
    .pill {
      background: rgba(0,0,0,0.8);
      padding: 10px 20px;
      border-radius: 20px;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 0 #000;
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <audio id="bgMusic" src="HiLau - 1984 (freetouse.com).mp3" loop></audio>

  <div id="title-screen">
    <div class="title-box">
      <div class="title-text">OVERHOOK</div>
      <span class="author-text">by FryedCheese</span>
    </div>
    <button class="start-btn" id="startBtn">PRESS TO START</button>
  </div>

  <div id="hud">
    <div class="pill">LVL: <span id="lvlVal">1</span>/30</div>
    <div class="pill" style="color: #ffea00;">TIME: <span id="timerVal">00:00.00</span></div>
    <div class="pill" id="statusVal" style="color: #ffe853;">CLICK & HOLD TO HOOK!</div>
    <div class="pill">BOUNCES: <span id="bounceVal">0</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>
</div>

<script>
// WEB AUDIO API ENGINE SETUP
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const bgMusic = document.getElementById('bgMusic');

function playBounceSound() {
  if (audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(160, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.14);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.14);
}

function playHookSound() {
  if (audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(750, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.09);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.09);
}

function playReelSound() {
  if (audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(500, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.05);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

function playWinSound() {
  if (audioCtx.state !== 'running') return;
  const notes = [300, 400, 500, 700];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.08);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.08);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.08 + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + i * 0.08);
    osc.stop(audioCtx.currentTime + i * 0.08 + 0.12);
  });
}

// GAME CODE
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const titleScreen = document.getElementById('title-screen');
const startBtn = document.getElementById('startBtn');
const hud = document.getElementById('hud');
const statusVal = document.getElementById('statusVal');
const lvlVal = document.getElementById('lvlVal');
const bounceVal = document.getElementById('bounceVal');
const timerVal = document.getElementById('timerVal');

let gameStarted = false;
let currentLevel = 1;
let cameraX = 0;
let bounceCount = 0;

// STOPWATCH VARIABLES
let startTime = 0;
let elapsedTime = 0;
let timerRunning = false;
let finalTimeFormatted = "";

function formatTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  const centiseconds = Math.floor((ms % 1000) / 10);

  const pad = (n) => (n < 10 ? '0' + n : n);
  return `${pad(minutes)}:${pad(seconds)}.${pad(centiseconds)}`;
}

function updateStopwatch() {
  if (timerRunning) {
    elapsedTime = Date.now() - startTime;
    timerVal.textContent = formatTime(elapsedTime);
  }
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Reel In Controls
let releaseTimeout = null;

function triggerReelIn() {
  if (rope.attached && rope.targetStar) {
    rope.targetLength = Math.max(20, rope.targetLength - 45);

    const dx = rope.targetStar.x - player.x;
    const dy = rope.targetStar.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 0) {
      const pullForce = 6.5;
      player.vx += (dx / dist) * pullForce;
      player.vy += (dy / dist) * pullForce;
    }

    playReelSound();
  }
}

const mouse = { x: 0, y: 0, isDown: false };
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) {
    mouse.isDown = true;
    clearTimeout(releaseTimeout);

    if (gameStarted) {
      if (!rope.attached) {
        attachHook();
      } else {
        triggerReelIn();
      }
    }
  }
});

window.addEventListener('mouseup', e => {
  if (e.button === 0) {
    mouse.isDown = false;
    clearTimeout(releaseTimeout);
    releaseTimeout = setTimeout(() => {
      releaseHook();
    }, 20);
  }
});

window.addEventListener('contextmenu', e => e.preventDefault());

startBtn.addEventListener('click', () => {
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  bgMusic.volume = 0.35;
  bgMusic.play().catch(e => console.log("Music play blocked by browser:", e));

  titleScreen.style.display = 'none';
  hud.style.display = 'flex';
  gameStarted = true;

  // Start Stopwatch
  startTime = Date.now();
  elapsedTime = 0;
  timerRunning = true;

  initLevel(1);
});

// Player
const player = {
  x: 150,
  y: 300,
  vx: 0,
  vy: 0,
  radius: 22,
  color: '#ff3b30'
};

// Grapple Rope
const rope = {
  attached: false,
  targetStar: null,
  length: 0,
  targetLength: 0,
  maxLength: 580
};

let stars = [];
let clouds = [];
let birds = [];
let cloudTrails = [];
let lastBirdSpawn = 0;
let finishLine = { x: 0, width: 90 };

function spawnBird() {
  const direction = Math.random() < 0.5 ? 1 : -1;
  const startX = direction === 1 ? cameraX - 100 : cameraX + canvas.width + 100;
  const startY = 60 + Math.random() * (canvas.height * 0.4);

  birds.push({
    x: startX,
    y: startY,
    speed: (2 + Math.random() * 2.5) * direction,
    wingAngle: Math.random() * Math.PI,
    size: 16 + Math.random() * 10,
    flapSpeed: 0.15 + Math.random() * 0.1,
    type: Math.floor(Math.random() * 3)
  });
}

function initLevel(lvl) {
  currentLevel = Math.min(Math.max(1, lvl), 30);
  lvlVal.textContent = currentLevel;
  statusVal.textContent = `LEVEL ${currentLevel} - GO!`;
  
  const spawnX = 150;
  const spawnY = canvas.height * 0.5;

  player.x = spawnX;
  player.y = spawnY - 30;
  player.vx = 0;
  player.vy = 0;
  cameraX = 0;
  rope.attached = false;

  stars = [];
  clouds = [];
  birds = [];
  cloudTrails = [];

  for (let t = 0; t < 6; t++) {
    cloudTrails.push({
      x: 100 + t * 650,
      y: 120 + (t % 3) * 120,
      radiusX: 180 + Math.random() * 100,
      radiusY: 40 + Math.random() * 30,
      rotation: (Math.random() - 0.5) * 0.3
    });
  }

  for (let b = 0; b < 5; b++) {
    spawnBird();
  }

  clouds.push({
    x: spawnX,
    y: spawnY,
    w: 170,
    h: 38,
    bumps: [
      { offsetX: -40, offsetY: -16, radius: 20 },
      { offsetX: 0, offsetY: -22, radius: 24 },
      { offsetX: 40, offsetY: -16, radius: 20 }
    ],
    color: '#ffffff',
    bounceSquish: 0
  });

  const starCount = 10 + currentLevel * 2;
  let lastX = 280;

  for (let i = 0; i < starCount; i++) {
    const spacing = 240 + Math.random() * 100 + (currentLevel * 5);
    const starX = lastX + spacing;
    const starY = (canvas.height * 0.28) + Math.sin(i * 0.7 + currentLevel) * (canvas.height * 0.18);
    
    const isMoving = currentLevel > 5 && (Math.random() < 0.35);
    const moveSpeed = isMoving ? 0.0012 + (Math.random() * 0.001) : 0;
    const moveRange = isMoving ? 25 + Math.random() * 35 : 0;

    stars.push({
      baseX: starX,
      baseY: starY,
      x: starX,
      y: starY,
      size: Math.max(22, 30 - Math.floor(currentLevel * 0.2)),
      pulse: Math.random() * Math.PI * 2,
      isMoving: isMoving,
      moveSpeed: moveSpeed,
      moveRange: moveRange,
      offset: Math.random() * 100
    });

    if (Math.random() > 0.35) {
      const w = 110 + Math.random() * 60;
      const h = 32 + Math.random() * 15;
      const cloudX = starX + (Math.random() * 40 - 20);
      const cloudY = Math.min(canvas.height - 80, starY + 150 + Math.random() * 70);

      let overlaps = false;
      for (let existing of clouds) {
        const dx = Math.abs(existing.x - cloudX);
        const dy = Math.abs(existing.y - cloudY);
        if (dx < (existing.w / 2 + w / 2 + 40) && dy < (existing.h / 2 + h / 2 + 30)) {
          overlaps = true;
          break;
        }
      }

      if (!overlaps) {
        const bumps = [];
        const bumpCount = 3 + Math.floor(Math.random() * 3);
        for (let b = 0; b < bumpCount; b++) {
          bumps.push({
            offsetX: (Math.random() - 0.5) * (w * 0.7),
            offsetY: -h / 2 + (Math.random() * -6),
            radius: 12 + Math.random() * 10
          });
        }

        clouds.push({
          x: cloudX,
          y: cloudY,
          w: w,
          h: h,
          bumps: bumps,
          color: '#ffffff',
          bounceSquish: 0
        });
      }
    }

    lastX = starX;
  }

  finishLine.x = lastX + 300;
}

function attachHook() {
  let closestStar = null;
  let minDist = rope.maxLength;

  stars.forEach(s => {
    const dx = s.x - player.x;
    const dy = s.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < minDist) {
      minDist = dist;
      closestStar = s;
    }
  });

  if (closestStar) {
    rope.attached = true;
    rope.targetStar = closestStar;
    const dx = player.x - closestStar.x;
    const dy = player.y - closestStar.y;
    rope.length = Math.sqrt(dx * dx + dy * dy);
    rope.targetLength = rope.length;
    playHookSound();
  }
}

function releaseHook() {
  clearTimeout(releaseTimeout);
  rope.attached = false;
  rope.targetStar = null;
}

function update() {
  if (!gameStarted) return;

  updateStopwatch();

  player.vy += 0.28;

  stars.forEach(s => {
    if (s.isMoving) {
      s.y = s.baseY + Math.sin(Date.now() * s.moveSpeed + s.offset) * s.moveRange;
    }
  });

  if (Date.now() - lastBirdSpawn > 3500) {
    if (birds.length < 10) {
      spawnBird();
    }
    lastBirdSpawn = Date.now();
  }

  birds.forEach((b, idx) => {
    b.x += b.speed;
    b.wingAngle += b.flapSpeed;

    if (b.x < cameraX - 250 || b.x > cameraX + canvas.width + 250) {
      birds.splice(idx, 1);
    }
  });

  if (rope.attached && rope.targetStar) {
    rope.length += (rope.targetLength - rope.length) * 0.18;

    const dx = player.x - rope.targetStar.x;
    const dy = player.y - rope.targetStar.y;
    const currentDist = Math.sqrt(dx * dx + dy * dy);

    if (currentDist > rope.length) {
      const angle = Math.atan2(dy, dx);
      player.x = rope.targetStar.x + Math.cos(angle) * rope.length;
      player.y = rope.targetStar.y + Math.sin(angle) * rope.length;

      const nx = dx / currentDist;
      const ny = dy / currentDist;
      const dot = player.vx * nx + player.vy * ny;

      player.vx -= dot * nx * 1.03;
      player.vy -= dot * ny * 1.03;
    }
  }

  player.vx *= 0.997;
  player.vy *= 0.997;

  player.x += player.vx;
  player.y += player.vy;

  clouds.forEach(c => {
    if (
      player.x + player.radius > c.x - c.w / 2 &&
      player.x - player.radius < c.x + c.w / 2 &&
      player.y + player.radius >= c.y - c.h / 2 &&
      player.y - player.radius <= c.y + c.h / 2
    ) {
      if (player.y > c.y && player.vy < 0) {
        player.vy = 14.5;
      } else {
        player.vy = -14.5;
      }

      player.vx += player.vx >= 0 ? 2.5 : -2.5;
      c.bounceSquish = 12;
      bounceCount++;
      bounceVal.textContent = bounceCount;
      playBounceSound();
    }

    if (c.bounceSquish > 0) c.bounceSquish -= 1;
  });

  cameraX += (player.x - canvas.width * 0.25 - cameraX) * 0.08;

  if (player.x + player.radius >= finishLine.x) {
    playWinSound();

    if (currentLevel < 30) {
      statusVal.textContent = "LEVEL COMPLETE!";
      gameStarted = false;
      setTimeout(() => {
        gameStarted = true;
        initLevel(currentLevel + 1);
      }, 900);
    } else {
      // BEAT LEVEL 30 - STOP & SAVE TIMER
      timerRunning = false;
      finalTimeFormatted = formatTime(elapsedTime);

      // Save Best Time to LocalStorage
      const storedBest = localStorage.getItem('overhook_best_time');
      let isNewPB = false;
      if (!storedBest || elapsedTime < parseInt(storedBest)) {
        localStorage.setItem('overhook_best_time', elapsedTime);
        isNewPB = true;
      }

      statusVal.textContent = isNewPB 
        ? `NEW RECORD! WIN TIME: ${finalTimeFormatted}`
        : `YOU WIN! TIME: ${finalTimeFormatted}`;

      gameStarted = false;
    }
  }

  if (player.y > canvas.height + 250) {
    statusVal.textContent = "FELL INTO THE VOID!";
    gameStarted = false;
    setTimeout(() => {
      gameStarted = true;
      initLevel(currentLevel);
    }, 800);
  }
}

// DRAWING FUNCTIONS FOR PIXEL BACKGROUND
function drawSkyGradient() {
  const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, '#00b4ff');
  gradient.addColorStop(0.5, '#5cd3ff');
  gradient.addColorStop(0.85, '#d4f4ff');
  gradient.addColorStop(1, '#66a2e8');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawCloudTrails() {
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';

  cloudTrails.forEach(t => {
    const renderX = t.x - cameraX * 0.3;
    ctx.beginPath();
    ctx.ellipse(renderX, t.y, t.radiusX, t.radiusY, t.rotation, 0, Math.PI * 1.8);
    ctx.stroke();
  });

  ctx.restore();
}

function drawBottomCloudOcean() {
  const baseY = canvas.height - 40;
  
  ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  for (let x = -100; x < canvas.width + 200; x += 110) {
    const px = x - (cameraX * 0.15) % 110;
    ctx.beginPath();
    ctx.arc(px, baseY - 40, 75, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#ffffff';
  for (let x = -100; x < canvas.width + 200; x += 90) {
    const px = x - (cameraX * 0.3) % 90;
    ctx.beginPath();
    ctx.arc(px, baseY, 65, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBird(b) {
  ctx.save();
  ctx.translate(b.x - cameraX, b.y);
  
  if (b.speed < 0) {
    ctx.scale(-1, 1);
  }

  const wingY = Math.sin(b.wingAngle) * b.size * 0.7;

  const bodyColors = ['#ffffff', '#7a8288', '#a87343'];
  const wingColors = ['#2c3e50', '#4a5157', '#5c3a1e'];

  ctx.fillStyle = bodyColors[b.type];
  ctx.beginPath();
  ctx.ellipse(0, 0, b.size, b.size * 0.55, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000000';
  ctx.stroke();

  ctx.fillStyle = wingColors[b.type];
  ctx.beginPath();
  ctx.moveTo(-b.size * 0.3, 0);
  ctx.quadraticCurveTo(0, -b.size + wingY, b.size * 0.7, -b.size * 0.2);
  ctx.quadraticCurveTo(0, wingY * 0.5, -b.size * 0.3, 0);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.arc(b.size * 0.5, -b.size * 0.1, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffaa00';
  ctx.beginPath();
  ctx.moveTo(b.size * 0.8, -2);
  ctx.lineTo(b.size * 0.8 + 8, 1);
  ctx.lineTo(b.size * 0.8, 4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
  let rot = Math.PI / 2 * 3;
  let x = cx;
  let y = cy;
  let step = Math.PI / spikes;

  ctx.beginPath();
  ctx.arc(cx, cy, outerRadius * 1.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 234, 0, 0.25)';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius;
    y = cy + Math.sin(rot) * outerRadius;
    ctx.lineTo(x, y);
    rot += step;

    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius);
  ctx.closePath();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#000000';
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawCloud(c) {
  ctx.save();
  ctx.translate(c.x - cameraX, c.y + c.bounceSquish);

  const path = new Path2D();
  path.roundRect(-c.w / 2, -c.h / 2, c.w, c.h, c.h / 2);
  c.bumps.forEach(b => {
    path.arc(b.offsetX, b.offsetY, b.radius, 0, Math.PI * 2);
  });

  ctx.fillStyle = c.color;
  ctx.fill(path);

  ctx.lineWidth = 3.5;
  ctx.strokeStyle = '#000000';
  ctx.stroke(path);

  ctx.restore();
}

function drawFinishLine() {
  const fx = finishLine.x - cameraX;
  const fw = finishLine.width;

  ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.fillRect(fx, -500, fw, canvas.height + 1000);

  const tileSize = 22;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  for (let y = 0; y < canvas.height; y += tileSize) {
    for (let x = 0; x < fw; x += tileSize) {
      if ((Math.floor(x / tileSize) + Math.floor(y / tileSize)) % 2 === 0) {
        ctx.fillRect(fx + x, y, tileSize, tileSize);
      }
    }
  }

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 6;
  ctx.strokeRect(fx, -500, fw, canvas.height + 1000);
}

function render() {
  drawSkyGradient();
  drawCloudTrails();
  birds.forEach(b => drawBird(b));
  drawBottomCloudOcean();

  if (gameStarted || rope.attached) {
    drawFinishLine();
    clouds.forEach(c => drawCloud(c));

    stars.forEach(s => {
      s.pulse += 0.05;
      const pulseRadius = s.size + Math.sin(s.pulse) * 2;
      drawStar(s.x - cameraX, s.y, 5, pulseRadius, pulseRadius / 2, '#ffea00');
    });

    if (rope.attached && rope.targetStar) {
      ctx.beginPath();
      ctx.moveTo(player.x - cameraX, player.y);
      ctx.lineTo(rope.targetStar.x - cameraX, rope.targetStar.y);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(player.x - cameraX, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#000000';
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(player.x - cameraX - 4, player.y - 4, 6, 0, Math.PI * 2);
    ctx.arc(player.x - cameraX + 6, player.y - 4, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(player.x - cameraX - 2, player.y - 4, 3, 0, Math.PI * 2);
    ctx.arc(player.x - cameraX + 8, player.y - 4, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
