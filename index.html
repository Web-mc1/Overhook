<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overhook - Web Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #3b3e4a;
      font-family: 'Fredoka', 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #game-container {
      position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      border-radius: 16px;
      overflow: hidden;
      border: 4px solid #ffffff;
    }
    canvas { background: #71cbf4; display: block; }
    
    /* Overlay Title Screen */
    #title-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(113, 203, 244, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px;
      z-index: 10;
    }
    .title-text {
      color: #ffffff;
      text-shadow: 3px 3px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000, 0 4px 10px rgba(0,0,0,0.3);
      font-size: 52px;
      font-weight: 900;
      line-height: 1.1;
    }
    .author-text {
      font-size: 28px;
      color: #ffffff;
      display: block;
      margin-top: 5px;
    }
    .start-btn {
      align-self: flex-end;
      background: #ffffff;
      color: #71cbf4;
      font-size: 28px;
      font-weight: 800;
      padding: 14px 28px;
      border-radius: 12px;
      border: 3px solid #71cbf4;
      box-shadow: 0 6px 0px #5ab3dc, 0 10px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0px #5ab3dc, 0 12px 18px rgba(0,0,0,0.25);
    }
    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0px #5ab3dc, 0 4px 8px rgba(0,0,0,0.2);
    }

    /* HUD UI */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-weight: 800;
      font-size: 20px;
      color: #fff;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
    }
    .pill {
      background: rgba(0,0,0,0.25);
      padding: 8px 18px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      border: 2px solid rgba(255,255,255,0.4);
    }
    #instructions {
      margin-top: 15px;
      color: #cfd8dc;
      font-size: 15px;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="title-screen">
    <div>
      <div class="title-text">
        Overhook<br>
        <span class="author-text">by Itzburntcheese</span>
      </div>
    </div>
    <button class="start-btn" id="startBtn">Press to start</button>
  </div>

  <div id="hud">
    <div class="pill">DIST: <span id="distVal">0</span>m</div>
    <div class="pill" id="statusVal" style="color: #ffe853;">CLICK NEAR A STAR TO HOOK</div>
    <div class="pill">LEVEL: <span id="lvlVal">1</span></div>
  </div>

  <canvas id="gameCanvas" width="900" height="520"></canvas>
</div>

<div id="instructions">
  <b>Controls:</b> Left Click / Hold = Grapple Star | Release = Launch | A / D or Arrow Keys = Swing Momentum
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const titleScreen = document.getElementById('title-screen');
const startBtn = document.getElementById('startBtn');
const distVal = document.getElementById('distVal');
const statusVal = document.getElementById('statusVal');
const lvlVal = document.getElementById('lvlVal');

let gameRunning = false;
let currentLevel = 1;
let cameraX = 0;

// Key States
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Mouse State
const mouse = { x: 0, y: 0, isDown: false };
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) {
    mouse.isDown = true;
    if (gameRunning) attachHook();
  }
});

canvas.addEventListener('mouseup', e => {
  if (e.button === 0) {
    mouse.isDown = false;
    releaseHook();
  }
});

startBtn.addEventListener('click', () => {
  titleScreen.style.display = 'none';
  gameRunning = true;
  initLevel(1);
});

// Player object
const player = {
  x: 120,
  y: 300,
  vx: 0,
  vy: 0,
  radius: 18,
  color: '#ff4b5c'
};

// Grapple Rope object
const rope = {
  attached: false,
  targetStar: null,
  length: 0,
  maxLength: 350
};

// Level elements
let stars = [];
let clouds = [];
let goalStar = null;

function initLevel(lvl) {
  currentLevel = lvl;
  lvlVal.textContent = lvl;
  statusVal.textContent = "SWING ACROSS!";
  
  player.x = 100;
  player.y = 280;
  player.vx = 4;
  player.vy = -2;
  cameraX = 0;
  rope.attached = false;

  stars = [];
  clouds = [];

  // Generate aerial stars & background clouds
  const count = 6 + lvl * 2;
  let lastX = 200;

  for (let i = 0; i < count; i++) {
    const starX = lastX + 160 + Math.random() * 80;
    const starY = 120 + Math.sin(i * 1.5) * 60 + Math.random() * 40;
    
    stars.push({
      x: starX,
      y: starY,
      size: 22,
      pulse: Math.random() * Math.PI * 2
    });

    // Decorative clouds below stars
    clouds.push({
      x: starX - 40 + Math.random() * 80,
      y: starY + 120 + Math.random() * 100,
      scale: 0.8 + Math.random() * 0.6
    });

    lastX = starX;
  }

  // End goal star
  goalStar = {
    x: lastX + 220,
    y: 180,
    size: 32
  };
}

function attachHook() {
  const worldMouseX = mouse.x + cameraX;
  const worldMouseY = mouse.y;

  let closestStar = null;
  let minDist = rope.maxLength;

  stars.concat([goalStar]).forEach(s => {
    const dx = s.x - player.x;
    const dy = s.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // Click direction angle check
    const mouseAngle = Math.atan2(worldMouseY - player.y, worldMouseX - player.x);
    const starAngle = Math.atan2(dy, dx);
    const angleDiff = Math.abs(mouseAngle - starAngle);

    if (dist < minDist && (angleDiff < 0.8 || dist < 120)) {
      minDist = dist;
      closestStar = s;
    }
  });

  if (closestStar) {
    rope.attached = true;
    rope.targetStar = closestStar;
    const dx = player.x - closestStar.x;
    const dy = player.y - closestStar.y;
    rope.length = Math.sqrt(dx * dx + dy * dy);
  }
}

function releaseHook() {
  rope.attached = false;
  rope.targetStar = null;
}

function update() {
  if (!gameRunning) return;

  // Gravity
  player.vy += 0.32;

  // Air swing momentum input
  if (keys['a'] || keys['arrowleft']) player.vx -= 0.22;
  if (keys['d'] || keys['arrowright']) player.vx += 0.22;

  // W / S Reel control
  if (rope.attached) {
    if ((keys['w'] || keys['arrowup']) && rope.length > 40) rope.length -= 3;
    if ((keys['s'] || keys['arrowdown']) && rope.length < rope.maxLength) rope.length += 3;
  }

  // Pendulum Grapple Constraint Physics
  if (rope.attached && rope.targetStar) {
    const dx = player.x - rope.targetStar.x;
    const dy = player.y - rope.targetStar.y;
    const currentDist = Math.sqrt(dx * dx + dy * dy);

    if (currentDist > rope.length) {
      const angle = Math.atan2(dy, dx);
      player.x = rope.targetStar.x + Math.cos(angle) * rope.length;
      player.y = rope.targetStar.y + Math.sin(angle) * rope.length;

      // Retain tangential velocity
      const nx = dx / currentDist;
      const ny = dy / currentDist;
      const dot = player.vx * nx + player.vy * ny;

      player.vx -= dot * nx * 1.02;
      player.vy -= dot * ny * 1.02;
    }
  }

  // Atmospheric drag
  player.vx *= 0.995;
  player.vy *= 0.995;

  // Apply velocity
  player.x += player.vx;
  player.y += player.vy;

  // Camera smooth follow
  cameraX += (player.x - 200 - cameraX) * 0.08;

  // HUD distance update
  distVal.textContent = Math.max(0, Math.floor(player.x / 10));

  // Check goal win
  const gdx = player.x - goalStar.x;
  const gdy = player.y - goalStar.y;
  if (Math.sqrt(gdx * gdx + gdy * gdy) < player.radius + goalStar.size) {
    statusVal.textContent = "GREAT SWING!";
    setTimeout(() => {
      initLevel(currentLevel + 1);
    }, 800);
  }

  // Fall into Void (Respawn)
  if (player.y > canvas.height + 80) {
    statusVal.textContent = "FELL INTO THE VOID!";
    setTimeout(() => {
      initLevel(currentLevel);
    }, 600);
  }
}

// Drawing Helper Functions
function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
  let rot = Math.PI / 2 * 3;
  let x = cx;
  let y = cy;
  let step = Math.PI / spikes;

  ctx.beginPath();
  ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius;
    y = cy + Math.sin(rot) * outerRadius;
    ctx.lineTo(x, y);
    rot += step;

    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius);
  ctx.closePath();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawCloud(x, y, scale) {
  ctx.save();
  ctx.translate(x - cameraX, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.beginPath();
  ctx.arc(0, 0, 30, 0, Math.PI * 2);
  ctx.arc(25, -10, 25, 0, Math.PI * 2);
  ctx.arc(50, 0, 30, 0, Math.PI * 2);
  ctx.arc(25, 10, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background Cloud Layers
  clouds.forEach(c => drawCloud(c.x, c.y, c.scale));

  // Draw Goal Star
  drawStar(goalStar.x - cameraX, goalStar.y, 5, goalStar.size, goalStar.size / 2, '#ffbe0b');

  // Draw Stars
  stars.forEach(s => {
    s.pulse += 0.05;
    const pulseRadius = s.size + Math.sin(s.pulse) * 2;
    drawStar(s.x - cameraX, s.y, 5, pulseRadius, pulseRadius / 2, '#ffea00');
  });

  // Draw Grapple Rope
  if (rope.attached && rope.targetStar) {
    ctx.beginPath();
    ctx.moveTo(player.x - cameraX, player.y);
    ctx.lineTo(rope.targetStar.x - cameraX, rope.targetStar.y);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Draw Red Player Ball ( matching Overhook title art )
  ctx.beginPath();
  ctx.arc(player.x - cameraX, player.y, player.radius, 0, Math.PI * 2);
  ctx.fillStyle = player.color;
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();

  // Inner highlight shine
  ctx.beginPath();
  ctx.arc(player.x - cameraX - 5, player.y - 5, 5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fill();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
