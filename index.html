<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overhook - Pixel Sky Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #00b4ff;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    /* TITLE SCREEN */
    #title-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, #0088ff 0%, #33c3ff 60%, #b3ecff 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 60px 40px;
      z-index: 10;
      overflow: hidden;
    }

    .menu-cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50px;
      pointer-events: none;
      animation: floatCloud linear infinite;
    }
    .menu-cloud::before, .menu-cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
    }
    .menu-cloud-1 { width: 180px; height: 50px; top: 15%; left: -200px; animation-duration: 22s; }
    .menu-cloud-1::before { width: 70px; height: 70px; top: -30px; left: 30px; }
    .menu-cloud-1::after { width: 50px; height: 50px; top: -20px; left: 90px; }

    .menu-cloud-2 { width: 240px; height: 65px; top: 60%; left: -250px; animation-duration: 16s; animation-delay: 5s; }
    .menu-cloud-2::before { width: 90px; height: 90px; top: -40px; left: 40px; }
    .menu-cloud-2::after { width: 70px; height: 70px; top: -25px; left: 120px; }

    @keyframes floatCloud {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(100vw + 400px)); }
    }

    .title-box {
      text-align: center;
      margin-top: 40px;
      z-index: 2;
    }
    .title-text {
      font-size: 88px;
      font-weight: 900;
      color: #ffea00;
      text-shadow: 
        6px 6px 0 #000, 
        -4px -4px 0 #000, 
        4px -4px 0 #000, 
        -4px 4px 0 #000,
        0 10px 20px rgba(0,0,0,0.3);
      line-height: 1;
      letter-spacing: 6px;
      transform: rotate(-2deg);
      animation: titleBounce 2s ease-in-out infinite alternate;
    }
    @keyframes titleBounce {
      0% { transform: rotate(-2deg) translateY(0px); }
      100% { transform: rotate(-2deg) translateY(-8px); }
    }

    .author-badge {
      display: inline-block;
      margin-top: 20px;
      background: #000000;
      color: #ffffff;
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }
    .author-badge span { color: #ffea00; }

    .best-score-box {
      margin-top: 15px;
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 2px 2px 0 #000;
      background: rgba(0,0,0,0.4);
      padding: 8px 18px;
      border-radius: 12px;
      border: 2px solid #ffffff;
      display: inline-block;
    }

    .controls-hint {
      margin-top: 15px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 1px 1px 0 #000;
    }

    .start-btn {
      z-index: 2;
      background: #ffea00;
      color: #000000;
      font-size: 32px;
      font-weight: 900;
      padding: 18px 46px;
      border-radius: 16px;
      border: 5px solid #000000;
      box-shadow: 0 10px 0 #000000, 0 15px 25px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: 40px;
      animation: btnPulse 1.5s infinite alternate;
    }
    @keyframes btnPulse {
      0% { box-shadow: 0 10px 0 #000000, 0 0 0 rgba(255,234,0,0.4); }
      100% { box-shadow: 0 10px 0 #000000, 0 0 25px rgba(255,234,0,0.8); }
    }
    .start-btn:hover {
      transform: translateY(-4px);
      background: #fff04d;
    }
    .start-btn:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #000000;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: none;
      justify-content: space-between;
      pointer-events: none;
      font-weight: 900;
      font-size: 18px;
      color: #fff;
      z-index: 5;
    }
    .pill {
      background: rgba(0,0,0,0.75);
      padding: 10px 18px;
      border-radius: 16px;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 0 #000;
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 1px;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

<div id="game-container">
  <audio id="bgMusic" src="HiLau - 1984 (freetouse.com).mp3" loop></audio>

  <div id="title-screen">
    <div class="menu-cloud menu-cloud-1"></div>
    <div class="menu-cloud menu-cloud-2"></div>

    <div class="title-box">
      <div class="title-text">OVERHOOK</div>
      <div class="author-badge">BY <span>FRYEDCHEESE</span></div>
      <br>
      <div class="best-score-box" id="bestScoreBox">BEST TIME: --:--.--</div>
      <div class="controls-hint">Controls: Left Click / Space to Grapple & Reel | R to Restart Level</div>
    </div>
    
    <button class="start-btn" id="startBtn">PRESS TO START</button>
  </div>

  <div id="hud">
    <div class="pill">LVL: <span id="lvlVal">1</span>/30</div>
    <div class="pill" style="color: #ffea00;">TIME: <span id="timerVal">00:00.00</span></div>
    <div class="pill" id="statusVal" style="color: #ffe853;">CLICK TO HOOK!</div>
    <div class="pill">BOUNCES: <span id="bounceVal">0</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>
</div>

<script>
// WEB AUDIO API
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const bgMusic = document.getElementById('bgMusic');

function playBounceSound() {
  if (audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  osc.type = 'sine';
  osc.frequency.setValueAtTime(180 + Math.min(bounceCount * 15, 300), now);
  osc.frequency.exponentialRampToValueAtTime(500, now + 0.12);
  gain.gain.setValueAtTime(0.25, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.12);
}

function playHookSound() {
  if (audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(800, now);
  osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
  gain.gain.setValueAtTime(0.2, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.08);
}

function playReelSound() {
  if (audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  osc.type = 'square';
  osc.frequency.setValueAtTime(500, now);
  osc.frequency.exponentialRampToValueAtTime(950, now + 0.05);
  gain.gain.setValueAtTime(0.12, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.05);
}

function playWinSound() {
  if (audioCtx.state !== 'running') return;
  const notes = [350, 450, 600, 800];
  const now = audioCtx.currentTime;
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const time = now + i * 0.07;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(0.2, time);
    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.12);
  });
}

// SETUP CANVAS
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

const titleScreen = document.getElementById('title-screen');
const startBtn = document.getElementById('startBtn');
const bestScoreBox = document.getElementById('bestScoreBox');
const hud = document.getElementById('hud');
const statusVal = document.getElementById('statusVal');
const lvlVal = document.getElementById('lvlVal');
const bounceVal = document.getElementById('bounceVal');
const timerVal = document.getElementById('timerVal');

let gameStarted = false;
let currentLevel = 1;
let cameraX = 0;
let bounceCount = 0;
let particles = [];
let trail = [];

// STOPWATCH
let startTime = 0;
let elapsedTime = 0;
let timerRunning = false;

function formatTime(ms) {
  const totalSeconds = (ms / 1000) | 0;
  const minutes = (totalSeconds / 60) | 0;
  const seconds = totalSeconds % 60;
  const centiseconds = ((ms % 1000) / 10) | 0;
  return `${minutes < 10 ? '0' + minutes : minutes}:${seconds < 10 ? '0' + seconds : seconds}.${centiseconds < 10 ? '0' + centiseconds : centiseconds}`;
}

const savedBest = localStorage.getItem('overhook_best_time');
if (savedBest) {
  bestScoreBox.textContent = `BEST TIME: ${formatTime(parseInt(savedBest))}`;
}

function updateStopwatch() {
  if (timerRunning) {
    elapsedTime = Date.now() - startTime;
    timerVal.textContent = formatTime(elapsedTime);
  }
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// PHYSICS & GAME OBJECTS
const player = {
  x: 150,
  y: 300,
  vx: 0,
  vy: 0,
  radius: 20,
  color: '#ff3b30',
  gravity: 0.32
};

const rope = {
  attached: false,
  targetStar: null,
  length: 0
};

let stars = [];
let clouds = [];
let birds = [];
let cloudTrails = [];
let finishLine = { x: 0, width: 90 };

function createParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 8 - 2,
      radius: 3 + Math.random() * 5,
      life: 20,
      maxLife: 20,
      color: color || '#ffea00'
    });
  }
}

function spawnBird() {
  const direction = Math.random() < 0.5 ? 1 : -1;
  const startX = direction === 1 ? cameraX - 100 : cameraX + canvas.width + 100;
  const startY = 60 + Math.random() * (canvas.height * 0.4);

  birds.push({
    x: startX,
    y: startY,
    speed: (2 + Math.random() * 2) * direction,
    wingAngle: Math.random() * Math.PI,
    size: 14 + Math.random() * 8,
    flapSpeed: 0.15 + Math.random() * 0.1
  });
}

function initLevel(lvl) {
  currentLevel = Math.min(Math.max(1, lvl), 30);
  lvlVal.textContent = currentLevel;
  statusVal.textContent = `LEVEL ${currentLevel} - GO!`;
  
  const spawnX = 150;
  const spawnY = canvas.height * 0.45;

  player.x = spawnX;
  player.y = spawnY - 30;
  player.vx = 4;
  player.vy = -3;
  cameraX = 0;
  rope.attached = false;
  rope.targetStar = null;
  bounceCount = 0;
  bounceVal.textContent = bounceCount;

  stars = [];
  clouds = [];
  birds = [];
  cloudTrails = [];
  particles = [];
  trail = [];

  for (let t = 0; t < 8; t++) {
    cloudTrails.push({
      x: 100 + t * 500,
      y: 80 + (t % 3) * 100,
      radiusX: 140 + Math.random() * 80,
      radiusY: 35 + Math.random() * 20
    });
  }

  for (let b = 0; b < 4; b++) spawnBird();

  // Starting bounce cloud
  clouds.push({
    x: spawnX,
    y: spawnY + 20,
    w: 180,
    h: 36,
    color: '#ffffff',
    squish: 0
  });

  const starCount = 8 + currentLevel * 2;
  let lastX = 300;

  for (let i = 0; i < starCount; i++) {
    const spacing = 220 + Math.random() * 80 + (currentLevel * 4);
    const starX = lastX + spacing;
    const starY = (canvas.height * 0.25) + Math.sin(i * 0.6) * (canvas.height * 0.18);
    
    const isMoving = currentLevel > 3 && (Math.random() < 0.4);

    stars.push({
      baseX: starX,
      baseY: starY,
      x: starX,
      y: starY,
      size: Math.max(22, 28 - ((currentLevel * 0.15) | 0)),
      pulse: Math.random() * Math.PI * 2,
      isMoving: isMoving,
      moveSpeed: 0.002 + Math.random() * 0.002,
      moveRange: 30 + Math.random() * 40,
      maxRopeLength: 350 + Math.random() * 100
    });

    if (Math.random() > 0.3) {
      clouds.push({
        x: starX + (Math.random() * 60 - 30),
        y: Math.min(canvas.height - 70, starY + 160 + Math.random() * 60),
        w: 110 + Math.random() * 50,
        h: 32,
        color: '#ffffff',
        squish: 0
      });
    }

    lastX = starX;
  }

  finishLine.x = lastX + 280;
}

// HOOK MECHANICS
function attachHook() {
  let closestStar = null;
  let minDist = Infinity;

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const dx = s.x - player.x;
    const dy = s.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist <= s.maxRopeLength && dist < minDist) {
      minDist = dist;
      closestStar = s;
    }
  }

  if (closestStar) {
    rope.attached = true;
    rope.targetStar = closestStar;
    rope.length = minDist;
    playHookSound();
    statusVal.textContent = "SWINGING!";
  }
}

function triggerReelIn() {
  if (rope.attached && rope.targetStar) {
    const dx = rope.targetStar.x - player.x;
    const dy = rope.targetStar.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 30) {
      // Shorten line smooth and add dynamic acceleration towards star
      rope.length = Math.max(20, rope.length - 45);
      
      const angle = Math.atan2(dy, dx);
      player.vx += Math.cos(angle) * 6.5;
      player.vy += Math.sin(angle) * 6.5;

      createParticles(player.x, player.y, 4, '#ffffff');
      playReelSound();
    }
  }
}

function releaseHook() {
  if (rope.attached) {
    rope.attached = false;
    rope.targetStar = null;
    statusVal.textContent = "RELEASED!";
  }
}

// INPUT LISTENERS
function handleActionStart() {
  if (!gameStarted) return;
  if (!rope.attached) {
    attachHook();
  } else {
    triggerReelIn();
  }
}

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) handleActionStart();
});
window.addEventListener('mouseup', e => {
  if (e.button === 0) releaseHook();
});

window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat) handleActionStart();
  if (e.code === 'KeyR' && gameStarted) initLevel(currentLevel);
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') releaseHook();
});

startBtn.addEventListener('click', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();

  bgMusic.volume = 0.3;
  bgMusic.play().catch(() => {});

  titleScreen.style.display = 'none';
  hud.style.display = 'flex';
  gameStarted = true;

  startTime = Date.now();
  elapsedTime = 0;
  timerRunning = true;

  initLevel(1);
});

// UPDATE LOOP
function update() {
  if (!gameStarted) return;

  updateStopwatch();

  // Apply Gravity
  player.vy += player.gravity;

  const now = Date.now();

  // Update Moving Stars
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    if (s.isMoving) {
      s.y = s.baseY + Math.sin(now * s.moveSpeed) * s.moveRange;
    }
  }

  // Swinging Pendulum Physics Constraint
  if (rope.attached && rope.targetStar) {
    const dx = player.x - rope.targetStar.x;
    const dy = player.y - rope.targetStar.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > rope.length) {
      const angle = Math.atan2(dy, dx);
      
      // Pull back to rope length
      player.x = rope.targetStar.x + Math.cos(angle) * rope.length;
      player.y = rope.targetStar.y + Math.sin(angle) * rope.length;

      // Constrain velocity along tether vector
      const nx = dx / dist;
      const ny = dy / dist;
      const dot = player.vx * nx + player.vy * ny;

      if (dot > 0) {
        player.vx -= dot * nx * 1.02; // Small elastic bounce
        player.vy -= dot * ny * 1.02;
      }
    }
  }

  // Air Resistance
  player.vx *= 0.995;
  player.vy *= 0.995;

  // Position Step
  player.x += player.vx;
  player.y += player.vy;

  // Trail effect
  if (Math.abs(player.vx) > 5 || Math.abs(player.vy) > 5) {
    trail.push({ x: player.x, y: player.y, alpha: 0.6 });
    if (trail.length > 8) trail.shift();
  }
  for (let t of trail) t.alpha -= 0.05;

  // Cloud Bouncing
  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    if (
      player.x + player.radius > c.x - c.w / 2 &&
      player.x - player.radius < c.x + c.w / 2 &&
      player.y + player.radius >= c.y - c.h / 2 &&
      player.y - player.radius <= c.y + c.h / 2 &&
      player.vy > 0
    ) {
      bounceCount++;
      bounceVal.textContent = bounceCount;

      player.vy = -10.5;
      player.vx *= 1.1; // Forward speed boost
      c.squish = 10;

      createParticles(player.x, player.y, 10, '#ffffff');
      playBounceSound();
    }
    if (c.squish > 0) c.squish -= 1;
  }

  // Update Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Birds Logic
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i];
    b.x += b.speed;
    b.wingAngle += b.flapSpeed;
    if (b.x < cameraX - 200 || b.x > cameraX + canvas.width + 200) {
      birds.splice(i, 1);
    }
  }
  if (birds.length < 5 && Math.random() < 0.02) spawnBird();

  // Smooth Camera Motion with Lookahead
  const targetCamX = player.x - canvas.width * 0.3 + player.vx * 12;
  cameraX += (targetCamX - cameraX) * 0.08;

  // Check Win Condition
  if (player.x + player.radius >= finishLine.x) {
    playWinSound();

    if (currentLevel < 30) {
      statusVal.textContent = "LEVEL COMPLETE!";
      gameStarted = false;
      setTimeout(() => {
        gameStarted = true;
        initLevel(currentLevel + 1);
      }, 700);
    } else {
      timerRunning = false;
      const formatted = formatTime(elapsedTime);
      const stored = localStorage.getItem('overhook_best_time');

      if (!stored || elapsedTime < parseInt(stored)) {
        localStorage.setItem('overhook_best_time', elapsedTime);
        statusVal.textContent = `NEW BEST RECORD! ${formatted}`;
      } else {
        statusVal.textContent = `YOU BEAT ALL LEVELS! ${formatted}`;
      }
      gameStarted = false;
    }
  }

  // Fall Death
  if (player.y > canvas.height + 150) {
    statusVal.textContent = "MISSED! RESTARTING...";
    gameStarted = false;
    setTimeout(() => {
      gameStarted = true;
      initLevel(currentLevel);
    }, 600);
  }
}

// RENDER LOOP WITH FRUSTUM CULLING
function render() {
  // Clear Sky
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#0099ff');
  grad.addColorStop(0.7, '#66d1ff');
  grad.addColorStop(1, '#d0f3ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Background Cloud Trails
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  for (let t of cloudTrails) {
    const rx = t.x - cameraX * 0.2;
    if (rx > -200 && rx < canvas.width + 200) {
      ctx.beginPath();
      ctx.ellipse(rx, t.y, t.radiusX, t.radiusY, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Birds Rendering
  for (let b of birds) {
    const bx = b.x - cameraX;
    if (bx > -50 && bx < canvas.width + 50) {
      ctx.save();
      ctx.translate(bx, b.y);
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const wingY = Math.sin(b.wingAngle) * b.size;
      ctx.moveTo(-b.size, wingY);
      ctx.quadraticCurveTo(0, -b.size * 0.5, b.size, wingY);
      ctx.stroke();
      ctx.restore();
    }
  }

  if (gameStarted || rope.attached) {
    // Finish Line
    const fx = finishLine.x - cameraX;
    if (fx > -100 && fx < canvas.width + 100) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(fx, 0, 10, canvas.height);
      ctx.fillStyle = '#000000';
      for (let y = 0; y < canvas.height; y += 30) {
        if ((y / 30) % 2 === 0) ctx.fillRect(fx, y, 10, 15);
      }
    }

    // Clouds (Cull off-screen)
    for (let c of clouds) {
      const cx = c.x - cameraX;
      if (cx > -c.w && cx < canvas.width + c.w) {
        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.roundRect(cx - c.w / 2, c.y - c.h / 2 + c.squish, c.w, c.h + c.squish, 16);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000';
        ctx.stroke();
      }
    }

    // Stars (Cull off-screen)
    let closestTarget = null;
    let minDist = Infinity;

    for (let s of stars) {
      const sx = s.x - cameraX;

      // Distance checking for active target indicator
      const dist = Math.hypot(s.x - player.x, s.y - player.y);
      if (dist <= s.maxRopeLength && dist < minDist) {
        minDist = dist;
        closestTarget = s;
      }

      if (sx > -100 && sx < canvas.width + 100) {
        // Draw Range Bubble
        ctx.beginPath();
        ctx.arc(sx, s.y, s.maxRopeLength, 0, Math.PI * 2);
        ctx.strokeStyle = (closestTarget === s && !rope.attached) ? 'rgba(255, 234, 0, 0.25)' : 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw Star Shape
        s.pulse += 0.04;
        const radius = s.size + Math.sin(s.pulse) * 2;
        ctx.save();
        ctx.translate(sx, s.y);
        ctx.fillStyle = (closestTarget === s || rope.targetStar === s) ? '#ffea00' : '#ffd000';
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * radius, -Math.sin((18 + i * 72) * Math.PI / 180) * radius);
          ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (radius / 2), -Math.sin((54 + i * 72) * Math.PI / 180) * (radius / 2));
        }
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000';
        ctx.stroke();
        ctx.restore();
      }
    }

    // Rope line
    if (rope.attached && rope.targetStar) {
      ctx.beginPath();
      ctx.moveTo(player.x - cameraX, player.y);
      ctx.lineTo(rope.targetStar.x - cameraX, rope.targetStar.y);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Player Trail
    for (let t of trail) {
      if (t.alpha > 0) {
        ctx.fillStyle = `rgba(255, 59, 48, ${t.alpha})`;
        ctx.beginPath();
        ctx.arc(t.x - cameraX, t.y, player.radius * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Particles
    for (let p of particles) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.beginPath();
      ctx.arc(p.x - cameraX, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }

    // Player Object
    const px = player.x - cameraX;
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.arc(px, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = '#000000';
    ctx.stroke();

    // Eyes
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(px + 4, player.y - 4, 5, 0, Math.PI * 2);
    ctx.arc(px + 12, player.y - 4, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(px + 5 + Math.min(player.vx * 0.2, 3), player.y - 4 + Math.min(player.vy * 0.2, 3), 2.5, 0, Math.PI * 2);
    ctx.arc(px + 13 + Math.min(player.vx * 0.2, 3), player.y - 4 + Math.min(player.vy * 0.2, 3), 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
