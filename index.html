<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overhook - Web Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1e2029;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 900px;
      height: 520px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border-radius: 16px;
      overflow: hidden;
      border: 4px solid #ffffff;
      background: #71cbf4;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    /* Title Screen */
    #title-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(113, 203, 244, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 50px;
      z-index: 10;
    }
    .title-box {
      color: #ffffff;
    }
    .title-text {
      font-size: 56px;
      font-weight: 900;
      text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      line-height: 1.1;
    }
    .author-text {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      display: block;
      margin-top: 5px;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
    }
    .start-btn {
      align-self: flex-end;
      background: #ffffff;
      color: #3baee0;
      font-size: 26px;
      font-weight: 900;
      padding: 14px 32px;
      border-radius: 12px;
      border: 3px solid #ffffff;
      box-shadow: 0 6px 0 #2a8cb9, 0 8px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .start-btn:hover {
      transform: translateY(-2px);
    }
    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #2a8cb9;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: none;
      justify-content: space-between;
      pointer-events: none;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
      z-index: 5;
    }
    .pill {
      background: rgba(0,0,0,0.3);
      padding: 8px 16px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.4);
    }
    #instructions {
      margin-top: 15px;
      color: #a0aab0;
      font-size: 14px;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="title-screen">
    <div class="title-box">
      <div class="title-text">Overhook</div>
      <span class="author-text">by FryedCheese</span>
    </div>
    <button class="start-btn" id="startBtn">Press to start</button>
  </div>

  <div id="hud">
    <div class="pill">DIST: <span id="distVal">0</span>m</div>
    <div class="pill" id="statusVal" style="color: #ffe853;">HOLD CLICK NEAR STAR TO HOOK</div>
    <div class="pill">LEVEL: <span id="lvlVal">1</span></div>
  </div>

  <canvas id="gameCanvas" width="900" height="520"></canvas>
</div>

<div id="instructions">
  <b>Controls:</b> Left Click / Hold = Grapple Star | Release = Launch | A / D or Left / Right Arrows = Swing Momentum
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const titleScreen = document.getElementById('title-screen');
const startBtn = document.getElementById('startBtn');
const hud = document.getElementById('hud');
const distVal = document.getElementById('distVal');
const statusVal = document.getElementById('statusVal');
const lvlVal = document.getElementById('lvlVal');

let gameStarted = false;
let currentLevel = 1;
let cameraX = 0;

// Key state
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Mouse state
const mouse = { x: 0, y: 0, isDown: false };
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) {
    mouse.isDown = true;
    if (gameStarted) attachHook();
  }
});

window.addEventListener('mouseup', e => {
  if (e.button === 0) {
    mouse.isDown = false;
    releaseHook();
  }
});

startBtn.addEventListener('click', () => {
  titleScreen.style.display = 'none';
  hud.style.display = 'flex';
  gameStarted = true;
  initLevel(1);
});

// Player object
const player = {
  x: 100,
  y: 250,
  vx: 0,
  vy: 0,
  radius: 18,
  color: '#ff4b5c'
};

// Grapple Rope
const rope = {
  attached: false,
  targetStar: null,
  length: 0,
  maxLength: 320
};

// Level elements
let stars = [];
let clouds = [];
let goalStar = { x: 0, y: 0, size: 30 };

function initLevel(lvl) {
  currentLevel = lvl;
  lvlVal.textContent = lvl;
  statusVal.textContent = "SWING ACROSS!";
  
  player.x = 100;
  player.y = 250;
  player.vx = 2;
  player.vy = -1;
  cameraX = 0;
  rope.attached = false;

  stars = [];
  clouds = [];

  // Generate stars & clouds
  const count = 5 + lvl * 2;
  let lastX = 180;

  for (let i = 0; i < count; i++) {
    const starX = lastX + 170 + Math.random() * 50;
    const starY = 130 + Math.sin(i * 1.5) * 50;
    
    stars.push({
      x: starX,
      y: starY,
      size: 22,
      pulse: Math.random() * Math.PI * 2
    });

    clouds.push({
      x: starX - 50 + Math.random() * 100,
      y: starY + 140 + Math.random() * 80,
      scale: 0.8 + Math.random() * 0.5
    });

    lastX = starX;
  }

  // Final goal star
  goalStar = {
    x: lastX + 220,
    y: 180,
    size: 30
  };
}

function attachHook() {
  const worldMouseX = mouse.x + cameraX;
  const worldMouseY = mouse.y;

  let closestStar = null;
  let minDist = rope.maxLength;

  const allTargets = [...stars, goalStar];
  allTargets.forEach(s => {
    const dx = s.x - player.x;
    const dy = s.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < minDist) {
      minDist = dist;
      closestStar = s;
    }
  });

  if (closestStar) {
    rope.attached = true;
    rope.targetStar = closestStar;
    const dx = player.x - closestStar.x;
    const dy = player.y - closestStar.y;
    rope.length = Math.sqrt(dx * dx + dy * dy);
  }
}

function releaseHook() {
  rope.attached = false;
  rope.targetStar = null;
}

function update() {
  if (!gameStarted) return;

  // Gravity
  player.vy += 0.35;

  // Air controls
  if (keys['a'] || keys['arrowleft']) player.vx -= 0.2;
  if (keys['d'] || keys['arrowright']) player.vx += 0.2;

  // Reel controls (W/S or Up/Down)
  if (rope.attached) {
    if ((keys['w'] || keys['arrowup']) && rope.length > 30) rope.length -= 3;
    if ((keys['s'] || keys['arrowdown']) && rope.length < rope.maxLength) rope.length += 3;
  }

  // Pendulum Grapple constraint
  if (rope.attached && rope.targetStar) {
    const dx = player.x - rope.targetStar.x;
    const dy = player.y - rope.targetStar.y;
    const currentDist = Math.sqrt(dx * dx + dy * dy);

    if (currentDist > rope.length) {
      const angle = Math.atan2(dy, dx);
      player.x = rope.targetStar.x + Math.cos(angle) * rope.length;
      player.y = rope.targetStar.y + Math.sin(angle) * rope.length;

      const nx = dx / currentDist;
      const ny = dy / currentDist;
      const dot = player.vx * nx + player.vy * ny;

      player.vx -= dot * nx * 1.02;
      player.vy -= dot * ny * 1.02;
    }
  }

  // Friction
  player.vx *= 0.995;
  player.vy *= 0.995;

  // Position updates
  player.x += player.vx;
  player.y += player.vy;

  // Smooth camera follow
  cameraX += (player.x - 200 - cameraX) * 0.08;

  // Update distance readout
  distVal.textContent = Math.max(0, Math.floor(player.x / 10));

  // Goal collision check
  const gdx = player.x - goalStar.x;
  const gdy = player.y - goalStar.y;
  if (Math.sqrt(gdx * gdx + gdy * gdy) < player.radius + goalStar.size) {
    statusVal.textContent = "LEVEL COMPLETE!";
    gameStarted = false;
    setTimeout(() => {
      gameStarted = true;
      initLevel(currentLevel + 1);
    }, 1000);
  }

  // Fall into void (Reset level)
  if (player.y > canvas.height + 100) {
    statusVal.textContent = "FELL INTO THE VOID!";
    gameStarted = false;
    setTimeout(() => {
      gameStarted = true;
      initLevel(currentLevel);
    }, 800);
  }
}

function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
  let rot = Math.PI / 2 * 3;
  let x = cx;
  let y = cy;
  let step = Math.PI / spikes;

  ctx.beginPath();
  ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius;
    y = cy + Math.sin(rot) * outerRadius;
    ctx.lineTo(x, y);
    rot += step;

    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius);
  ctx.closePath();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawCloud(x, y, scale) {
  ctx.save();
  ctx.translate(x - cameraX, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.beginPath();
  ctx.arc(0, 0, 30, 0, Math.PI * 2);
  ctx.arc(25, -10, 25, 0, Math.PI * 2);
  ctx.arc(50, 0, 30, 0, Math.PI * 2);
  ctx.arc(25, 10, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function render() {
  // Clear background
  ctx.fillStyle = '#71cbf4';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Background clouds
  clouds.forEach(c => drawCloud(c.x, c.y, c.scale));

  if (gameStarted || rope.attached) {
    // Goal Star
    drawStar(goalStar.x - cameraX, goalStar.y, 5, goalStar.size, goalStar.size / 2, '#ffbe0b');

    // Swing Stars
    stars.forEach(s => {
      s.pulse += 0.05;
      const pulseRadius = s.size + Math.sin(s.pulse) * 2;
      drawStar(s.x - cameraX, s.y, 5, pulseRadius, pulseRadius / 2, '#ffea00');
    });

    // Grapple rope
    if (rope.attached && rope.targetStar) {
      ctx.beginPath();
      ctx.moveTo(player.x - cameraX, player.y);
      ctx.lineTo(rope.targetStar.x - cameraX, rope.targetStar.y);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // Red Player Ball
    ctx.beginPath();
    ctx.arc(player.x - cameraX, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    // Shine highlight
    ctx.beginPath();
    ctx.arc(player.x - cameraX - 5, player.y - 5, 5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fill();
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
